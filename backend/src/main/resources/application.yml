app:
  folder: ${user.home}/.optimize-elykia-core/operations/
  customer:
    auth:
      firebase:
        enabled: ${FIREBASE_ENABLED:false}
        credentials-path: ${FIREBASE_CREDENTIALS:}
    mobile-money:
      mixx-number: ${CUSTOMER_MOBILE_MONEY_MIXX_NUMBER:}
      moov-number: ${CUSTOMER_MOBILE_MONEY_MOOV_NUMBER:}
  security:
    parameter:
      init-enabled: true
      init-data[0]:
        key: ENABLED_ACCOUNT_BALANCE_CONTROL
        value: true
        description: Activer la vérification du solde du compte du client pour limiter le montant de crédit qu'il peut prendre
      init-data[1]:
        key: AGENCY_COLLECTOR
        value: COM001
        description: Le Username du commercial qui comptabilise les opération de vente en agence
      init-data[2]:
        key: USE_MEMBER_REGISTRATION_DATE_FOR_SHARE
        value: true
        description: Utiliser la date d'adhésion d'un membre tontine pour calculer la part société à prélever (si désactiver, on utilise la date debut de la session de tontine)
      init-data[3]:
        key: ENABLED_MOBILE_DEVICE_RESTRICTION
        value: false
        description: Activer le contrôle des appareils autorisés pour l'application mobile
      init-data[4]:
        key: ENABLED_FIFO_STOCK_VALUATION
        value: false
        description: Activer la valorisation FIFO du stock magasin (lots et coût réel des sorties)

loki:
  url: ${LOKI_URL:https://logs-prod-028.grafana.net/loki/api/v1/push}
  user-id: ${LOKI_USER_ID:1114217}
  api-key: ${LOKI_API_KEY:}

springdoc:
  swagger-ui:
    # Allow Swagger UI to load the local api-docs regardless of the host (IP, domain, etc.)
    # Without this, Swagger UI tries to load petstore by default when accessed from an external IP
    disable-swagger-default-url: true
    url: /v3/api-docs
  api-docs:
    enabled: true

logging:
  file:
    path: ${user.home}/.${spring.application.name}/logs

# Elykia IA — providers : stub | ollama | anthropic | openai | gemini | deepseek
# Voir backend/docs/AI_ASSISTANT.md pour la configuration détaillée.
elykia:
  ai:
    enabled: true
    provider: stub
    model: qwen2.5-coder:7b
    max-tokens: 4096
    rate-limit-per-user-per-minute: 15
    rate-limit-per-user-per-day: 20
    rate-limit-per-user-per-week: 120
    conversation:
      max-history-messages: 20
      retention-days: 90
    sql:
      max-rows: 500
      timeout-seconds: 10
      max-retries: 2
      expose-sql-to-user: false
      examples-path: classpath:ai/sql-examples.json
      max-few-shot-examples: 3
    help:
      user-guide-index-path: classpath:ai/user-guide-index.json
      top-k-chunks: 5
      embedding-search-enabled: false
      embedding-model: nomic-embed-text
  recruitment:
    bucket: ${MINIO_RECRUITMENT_BUCKET:elykia-recruitment}
    max-cv-bytes: 5242880
    max-offer-image-bytes: 2097152
    site:
      max-applications-per-ip-per-hour: 2
