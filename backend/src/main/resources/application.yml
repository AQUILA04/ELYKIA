spring:
  profiles:
    active: prod
  application:
    name: optimize-elykia-core
  ai:
    # Auto-config Spring AI pilotée par elykia.ai.provider (AiProviderEnvironmentPostProcessor).
    # Par défaut : aucun modèle cloud (stub Elykia) — pas de clé API requise.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      enabled: false
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:7b
          temperature: 0.1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-20250514
          temperature: 0.1
          max-tokens: 4096
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1
          max-tokens: 4096
    vertex:
      ai:
        gemini:
          project-id: ${GOOGLE_CLOUD_PROJECT:}
          location: ${GOOGLE_CLOUD_LOCATION:us-central1}
          chat:
            options:
              model: gemini-2.0-flash
              temperature: 0.1
              max-output-tokens: 4096
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.1
          max-tokens: 4096

  # Configuration Flyway pour la gestion des migrations de base de données
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    placeholder-replacement: true
    placeholders:
      project: optimize-elykia-core

  task:
    scheduling:
      pool:
        size: 4

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:elykia-clients}
  reports-bucket: ${MINIO_REPORTS_BUCKET:elykia-reports}
  mobile-releases-bucket: ${MINIO_MOBILE_RELEASES_BUCKET:elykia-mobile-releases}
  mobile-release-channel: ${MOBILE_RELEASE_CHANNEL:prod}
  customer-space-releases-bucket: ${MINIO_CUSTOMER_SPACE_RELEASES_BUCKET:elykia-customer-space-releases}
  customer-space-release-channel: ${CUSTOMER_SPACE_RELEASE_CHANNEL:prod}
  recruitment-bucket: ${MINIO_RECRUITMENT_BUCKET:elykia-recruitment}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

