<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rapport des Articles Vendus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }

        .company-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        .header-info {
            margin-bottom: 20px;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
        }

        .header-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #003366;
            color: white;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .summary {
            margin-top: 30px;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            color: #003366;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="company-name">AMENOUVEVE - YAVEH</div>
    <h1>Rapport des Articles Vendus</h1>

    <div class="header-info">
        <p><strong>Commercial : </strong> <span th:text="${collectorName}"></span></p>
        <p><strong>Période : </strong> Du <span th:text="${startDate}"></span> au <span th:text="${endDate}"></span></p>
        <p><strong>Date de génération : </strong> <span th:text="${generationDate}"></span></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Article</th>
                <th>Commercial</th>
                <th style="text-align: center">Quantité Totale</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${articlesEmpty}">
                <td colspan="4" style="text-align: center; font-style: italic;">Aucun article vendu trouvé pour ces critères.</td>
            </tr>
            <tr th:each="article, iterStat : ${articles}">
                <td th:text="${iterStat.count}"></td>
                <td th:text="${article.articleName}" style="font-weight: bold; color: #003366;"></td>
                <td th:text="${article.commercial != null ? article.commercial : 'Sans commercial'}"></td>
                <td th:text="${article.totalQuantity}" style="text-align: center; font-weight: bold;"></td>
            </tr>
        </tbody>
    </table>

    <div class="summary">
        <p>Volume total d'articles vendus : <span th:text="${totalQuantity}"></span></p>
    </div>

    <div class="footer">
        © 2026 Elykia. Tous droits réservés.
    </div>

</body>
</html>
