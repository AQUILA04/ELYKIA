<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pdfDocumentTitle}">Rapport des Articles Vendus</title>
    <th:block th:replace="~{pdf/fragments :: styles}"></th:block>
    <style>
        table.data-table .qty { text-align: center; }
        table.data-table .amount { text-align: right; white-space: nowrap; }
    </style>
</head>
<body>
    <div th:replace="~{pdf/fragments :: header}"></div>

    <table class="pdf-meta">
        <tr>
            <td>
                <span class="pdf-meta-label">Commercial</span>
                <span class="pdf-meta-value" th:text="${collectorName}">Tous</span>
            </td>
            <td>
                <span class="pdf-meta-label">Période</span>
                <span class="pdf-meta-value" th:text="'Du ' + ${startDate} + ' au ' + ${endDate}">Du … au …</span>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <span class="pdf-meta-label">Date de génération</span>
                <span class="pdf-meta-value" th:text="${generationDate}">01/01/2026 00:00</span>
            </td>
        </tr>
    </table>

    <table class="pdf-kpi">
        <tr>
            <td class="kpi-cyan">
                <div class="kpi-label">Montant total</div>
                <div class="kpi-value" th:text="${#numbers.formatDecimal(totalAmount, 1, 'WHITESPACE', 0, 'COMMA') + ' FCFA'}">0 FCFA</div>
            </td>
            <td>
                <div class="kpi-label">Quantité totale</div>
                <div class="kpi-value" th:text="${totalQuantity}">0</div>
            </td>
        </tr>
    </table>

    <div th:if="${articlesEmpty}" class="pdf-empty">
        Aucun article vendu trouvé pour ces critères.
    </div>

    <table class="data-table" th:unless="${articlesEmpty}">
        <thead>
            <tr>
                <th class="num">#</th>
                <th>Article</th>
                <th>Commercial</th>
                <th class="qty">Quantité totale</th>
                <th class="amount">Prix unitaire</th>
                <th class="amount">Prix total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="article, iterStat : ${articles}">
                <td class="num" th:text="${iterStat.count}">1</td>
                <td th:text="${article.articleName}">Article</td>
                <td th:text="${article.commercial != null ? article.commercial : 'Sans commercial'}">Commercial</td>
                <td class="qty" th:text="${article.totalQuantity}">0</td>
                <td class="amount" th:text="${#numbers.formatDecimal(article.unitPrice, 1, 'WHITESPACE', 0, 'COMMA')}">0</td>
                <td class="amount" th:text="${#numbers.formatDecimal(article.totalAmount, 1, 'WHITESPACE', 0, 'COMMA')}">0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
