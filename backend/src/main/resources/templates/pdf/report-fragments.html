<!DOCTYPE html>
<!--
  Fragments des PDF du rapport commerciaux (design system documents Elykia, navy #0a2472).
  Compatibles iText html2pdf : pas de flexbox ni de grid, mise en page par tableaux.
  Le pied de page n/N est tamponné par PdfHtmlRenderer (style MODERN).
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="styles">
        <style>
            /* Première page : la bande de marque touche le haut ; pages suivantes : marge haute. */
            @page { size: A4; margin: 12mm 0 22mm 0; }
            @page :first { margin-top: 0; }
            * { box-sizing: border-box; }
            body { font-family: Helvetica, Arial, sans-serif; font-size: 9.5px; color: #0d1b3e; margin: 0; padding: 0; }
            .page { padding: 0 14mm; }

            /* Bande de marque : 10 px, dégradé navy, segment clair à gauche */
            table.brand-band { width: 100%; border-collapse: collapse; height: 10px; }
            table.brand-band td { height: 10px; padding: 0; }
            .band-navy { background-color: #0a2472; }
            .band-mid { background-color: #1a3a8f; }
            .band-accent { background-color: #1565c0; }
            .band-soft { background-color: #4f83e0; }

            /* En-tête : logo + marque à gauche, document à droite */
            table.doc-head { width: 100%; border-collapse: collapse; margin: 16px 0 14px 0; }
            table.doc-head td { vertical-align: middle; padding: 0; }
            .logo { width: 40px; height: 40px; background-color: #0a2472; color: #ffffff; font-size: 18px; font-weight: bold;
                    text-align: center; line-height: 40px; border-radius: 10px; }
            .brand-name { font-size: 13px; font-weight: bold; color: #0a2472; letter-spacing: 1.2px; }
            .brand-sub { font-size: 8.5px; color: #64748b; margin-top: 2px; }
            .doc-label { font-size: 8px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #64748b; text-align: right; }
            .doc-title { font-size: 18px; font-weight: bold; color: #0a2472; text-align: right; margin-top: 2px; }
            .doc-pill { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 10px; background-color: #e8edf8;
                        color: #0a2472; font-size: 9px; font-weight: bold; }

            /* Cartes d'information (3 colonnes) */
            table.cards { width: 100%; border-collapse: separate; border-spacing: 6px 0; margin: 0 -6px 14px -6px; }
            table.cards td { border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; vertical-align: top; background-color: #ffffff; }
            .lbl { font-size: 7.5px; font-weight: bold; letter-spacing: 0.9px; text-transform: uppercase; color: #64748b; }
            .val { font-size: 10.5px; font-weight: bold; color: #0d1b3e; margin-top: 3px; }
            .sub { font-size: 8px; color: #64748b; margin-top: 2px; }

            /* Titres de section */
            table.sec { width: 100%; border-collapse: collapse; margin: 14px 0 6px 0; }
            table.sec td { padding: 0; vertical-align: bottom; }
            .sec-title { font-size: 10px; font-weight: bold; letter-spacing: 1.1px; text-transform: uppercase; color: #0a2472; }
            .sec-hint { font-size: 8px; color: #64748b; text-align: right; }

            /* Équation de rapprochement */
            table.eq { width: 100%; border-collapse: separate; border-spacing: 3px 0; margin: 0 -3px; }
            table.eq td.term { background-color: #f2f5fc; border-radius: 8px; padding: 7px 8px; vertical-align: top; }
            table.eq td.op { width: 10px; text-align: center; color: #94a3b8; font-size: 12px; font-weight: bold; vertical-align: middle; }
            table.eq td.due { background-color: #e8edf8; }
            table.eq td.late { background-color: #fff8e1; }
            table.eq td.ok { background-color: #e8f5e9; }
            .eq-val { font-size: 12px; font-weight: bold; color: #0d1b3e; margin-top: 3px; }
            td.due .lbl, td.due .eq-val { color: #0a2472; }
            td.late .lbl, td.late .eq-val { color: #92600a; }
            td.ok .lbl, td.ok .eq-val { color: #2e7d32; }

            /* Bandeau reste / total */
            table.total { width: 100%; border-collapse: collapse; margin-top: 8px; }
            table.total td { padding: 8px 12px; }
            .total-navy { background-color: #0a2472; color: #ffffff; }
            .total-amber { background-color: #fff8e1; color: #92600a; }
            .total-green { background-color: #e8f5e9; color: #2e7d32; }
            .total-label { font-size: 8.5px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
            .total-value { font-size: 15px; font-weight: bold; text-align: right; }

            /* Blocs d'activité : 3 colonnes de lignes clé / valeur */
            table.blocks { width: 100%; border-collapse: separate; border-spacing: 6px 0; margin: 0 -6px; }
            table.blocks > tbody > tr > td { width: 33.33%; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; vertical-align: top; }
            .block-title { font-size: 10px; font-weight: bold; color: #0a2472; padding-bottom: 4px; }
            table.kv { width: 100%; border-collapse: collapse; }
            table.kv td { padding: 4px 0; border-top: 1px solid #e2e8f0; font-size: 8.5px; }
            table.kv td.k { color: #4a5568; }
            table.kv td.v { text-align: right; font-weight: bold; color: #0d1b3e; }

            /* Tableau de données */
            table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 8.5px; }
            table.data thead { display: table-header-group; }
            table.data th { background-color: #f2f5fc; color: #0a2472; font-size: 7.5px; font-weight: bold; letter-spacing: 0.7px;
                            text-transform: uppercase; text-align: left; padding: 6px 7px; }
            table.data th.first { border-radius: 6px 0 0 6px; }
            table.data th.last { border-radius: 0 6px 6px 0; }
            table.data td { padding: 6px 7px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
            table.data tr { page-break-inside: avoid; }
            table.data tfoot td { background-color: #f2f5fc; font-weight: bold; color: #0a2472; border-bottom: none; }
            .r, table.data th.r, table.data td.r { text-align: right; }
            .c, table.data th.c, table.data td.c { text-align: center; }
            .muted { color: #94a3b8; }
            .small { font-size: 7.5px; color: #64748b; }
            .strong { font-weight: bold; }
            .neg { color: #92600a; font-weight: bold; }

            /* Pastilles */
            .pill { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 7.5px; font-weight: bold; }
            .pill-navy { background-color: #e8edf8; color: #0a2472; }
            .pill-green { background-color: #e8f5e9; color: #2e7d32; }
            .pill-amber { background-color: #fff8e1; color: #92600a; }
            .pill-red { background-color: #ffebee; color: #c62828; }
            .pill-grey { background-color: #f1f5f9; color: #4a5568; }

            .empty { text-align: center; padding: 16px 10px; color: #64748b; border: 1px dashed #cbd5e1; border-radius: 8px; }
            .avoid { page-break-inside: avoid; }

            /* Signatures */
            table.signs { width: 100%; border-collapse: separate; border-spacing: 24px 0; margin: 18px -24px 0 -24px; }
            table.signs td { width: 50%; vertical-align: top; }
            .sign-line { border-bottom: 1px solid #cbd5e1; height: 34px; }
        </style>
    </th:block>
</head>
<body>
<!-- En-tête : th:replace="~{pdf/report-fragments :: header(${titre}, ${pastille})}" -->
<div th:fragment="header(title, pill)">
    <table class="brand-band">
        <tr>
            <td class="band-navy" style="width: 14mm"></td>
            <td class="band-soft" style="width: 24mm"></td>
            <td class="band-navy"></td>
            <td class="band-mid" style="width: 35%"></td>
            <td class="band-accent" style="width: 20%"></td>
        </tr>
    </table>
    <div class="page">
        <table class="doc-head">
            <tr>
                <td style="width: 48px"><div class="logo">A</div></td>
                <td>
                    <div class="brand-name" th:text="${pdfCompanyName}">AMENOUVEVE-YAVEH</div>
                    <div class="brand-sub">
                        <span th:text="${pdfCompanyAddress}">TOKOIN HÔPITAL</span> · Tél.
                        <span th:text="${pdfCompanyPhoneDisplay}">96 18 68 22</span>
                    </div>
                </td>
                <td>
                    <div class="doc-label">Document</div>
                    <div class="doc-title" th:text="${title}">Titre</div>
                    <div style="text-align: right"><span class="doc-pill" th:text="${pill}">Période</span></div>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
