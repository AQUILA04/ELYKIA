<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pdfDocumentTitle}">Reste chez les clients</title>
    <th:block th:replace="~{pdf/report-fragments :: styles}"></th:block>
</head>
<body>
<div th:replace="~{pdf/report-fragments :: header(${pdfDocumentTitle}, ${doc.commercialLabel} + ' · ' + ${doc.year})}"></div>

<div class="page">
    <table class="cards">
        <tr>
            <td>
                <div class="lbl">Commercial</div>
                <div class="val" th:text="${doc.commercialLabel}">COM001</div>
            </td>
            <td>
                <div class="lbl">Année</div>
                <div class="val" th:text="${doc.year}">2026</div>
            </td>
            <td>
                <div class="lbl">Généré le</div>
                <div class="val" th:text="${doc.generationDate}">13/08/2026 18:00</div>
            </td>
        </tr>
    </table>

    <table class="total avoid" style="margin-bottom: 4px">
        <tr class="total-amber">
            <td class="total-label">
                Somme restant due · <span th:text="${doc.salesCount}">0</span> crédit(s)
            </td>
            <td class="total-value" th:text="${#numbers.formatDecimal(doc.totalRemainingAmount, 1, 'WHITESPACE', 0, 'COMMA')} + ' FCFA'">0 FCFA</td>
        </tr>
    </table>

    <table class="sec"><tr><td class="sec-title">Crédits encore dus</td><td class="sec-hint">Portefeuille actuel du commercial</td></tr></table>
    <div class="empty" th:if="${#lists.isEmpty(doc.rows)}">
        Aucun crédit encore dû dans le portefeuille actuel de ce commercial.
    </div>
    <table class="data" th:if="${not #lists.isEmpty(doc.rows)}">
        <colgroup>
            <col style="width: 5%"/><col style="width: 30%"/><col style="width: 22%"/><col style="width: 13%"/><col style="width: 15%"/><col style="width: 15%"/>
        </colgroup>
        <thead>
        <tr>
            <th class="first c">#</th>
            <th>Client</th>
            <th>Référence</th>
            <th>Début</th>
            <th class="r">Montant total</th>
            <th class="r last">Reste dû</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${doc.rows}">
            <td class="c muted" th:text="${row.index}">1</td>
            <td class="strong" th:text="${row.clientLastname} + ' ' + ${row.clientFirstname}">Doe Jane</td>
            <td class="small" th:text="${row.reference}">REF-001</td>
            <td th:text="${row.beginDate}">01/01/2026</td>
            <td class="r" th:text="${row.totalAmount}">0</td>
            <td class="r neg" th:text="${row.totalAmountRemaining}">0</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
