<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; color: #222; }
        h1, h2 { margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
    </style>
</head>
<body>
<h1>Rapport mensuel commercial</h1>
<p>
    Commercial: <strong th:text="${snapshot.commercialUsername}"></strong> -
    Mois: <strong th:text="${snapshot.month} + '/' + ${snapshot.year}"></strong>
</p>

<h2>Timeline mouvements stock et marges</h2>
<table>
    <thead>
    <tr>
        <th>Date</th>
        <th>Article</th>
        <th>Type</th>
        <th>Qté</th>
        <th>PA unit.</th>
        <th>PV unit.</th>
        <th>Marge</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${timeline}">
        <td th:text="${line.operationDate}"></td>
        <td th:text="${line.articleName}"></td>
        <td th:text="${line.movementType}"></td>
        <td th:text="${line.quantityMoved}"></td>
        <td th:text="${line.unitPurchasePrice}"></td>
        <td th:text="${line.unitSalePrice}"></td>
        <td th:text="${line.marginAmount}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
