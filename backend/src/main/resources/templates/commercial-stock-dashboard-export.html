<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pdfDocumentTitle}">Rapport de Stock Commercial</title>
    <th:block th:replace="~{pdf/fragments :: styles}"></th:block>
</head>
<body>
    <div th:replace="~{pdf/fragments :: header}"></div>

    <table class="pdf-meta">
        <tr>
            <td>
                <span class="pdf-meta-label">Période</span>
                <span class="pdf-meta-value"
                      th:text="${context.startDate + ' au ' + context.endDate}">2026-08-01 au 2026-08-31</span>
            </td>
            <td>
                <span class="pdf-meta-label">Commercial</span>
                <span class="pdf-meta-value" th:text="${context.collector}">COM001</span>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <span class="pdf-meta-label">Date de génération</span>
                <span class="pdf-meta-value" th:text="${context.generationDate}">13/08/2026 18:00</span>
            </td>
        </tr>
    </table>

    <div th:if="${#lists.isEmpty(context.items)}" class="pdf-empty">
        Aucune donnée trouvée pour cette période.
    </div>

    <table th:if="${!#lists.isEmpty(context.items)}" class="data-table">
        <thead>
        <tr>
            <th>Article</th>
            <th>Prix Unitaire</th>
            <th>Pris (Magasin)</th>
            <th>Vendu (Clients)</th>
            <th>Retourné</th>
            <th>Restant</th>
            <th>Valeur Vendue</th>
            <th>Valeur Restante</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${context.items}">
            <td th:text="${item.articleName}">Article</td>
            <td th:text="${item.unitPrice}">0</td>
            <td th:text="${item.quantityTaken}">0</td>
            <td th:text="${item.quantitySold}">0</td>
            <td th:text="${item.quantityReturned}">0</td>
            <td th:text="${item.quantityRemaining}">0</td>
            <td th:text="${item.soldValue}">0</td>
            <td th:text="${item.remainingValue}">0</td>
        </tr>
        <tr>
            <td><strong>Totaux</strong></td>
            <td></td>
            <td th:text="${context.totalTaken}">0</td>
            <td th:text="${context.totalSold}">0</td>
            <td th:text="${context.totalReturned}">0</td>
            <td th:text="${context.totalRemaining}">0</td>
            <td th:text="${context.totalSoldValue}">0</td>
            <td th:text="${context.totalRemainingValue}">0</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
