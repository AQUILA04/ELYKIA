spring:
  application:
    name: optimize-elykia-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oec_formation}
    username: ${SPRING_DATASOURCE_USERNAME:oec}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  main:
    allow-circular-references: true
  boot:
    admin:
      client:
        url: http://localhost:8090
        instance:
          service-base-url: http://localhost:8080
          service-host-type: IP

app:
  folder: ${user.home}/.optimize-elykia-core/operations/
  credit:
    dividend: 6
  users:
    root:
      lastname: ADLER
      firstname: Francis
      email: ${APP_ROOT_EMAIL:root@localhost}
      phone: ${APP_ROOT_PHONE:00000000}
      gender: MALE
    manager:
      lastname: AKOFA
      firstname: Yasmine
      email: ${APP_MANAGER_EMAIL:manager@localhost}
      phone: ${APP_MANAGER_PHONE:00000000}
      gender: FEMALE

bezkoder:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: 86400000
    jwtRefreshExpirationMs: 86400000
logging:
  level:
    org:
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: DEBUG
  file:
    path: ${user.home}/.${spring.application.name}/logs/


  management:
    endpoints:
      web:
        exposure:
          include: health,prometheus
    info:
     env:
      enabled: true

server:
  port: 8081
  ssl:
    enabled: false

