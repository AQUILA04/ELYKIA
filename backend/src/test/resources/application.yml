spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiMultiModalEmbeddingAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.gemini.VertexAiGeminiChatAutoConfiguration
  datasource:
    # Les valeurs réelles sont injectées par IntegrationTestSupport.
    url: jdbc:postgresql://localhost:5432/elykia_test
    driverClassName: org.postgresql.Driver
    username: elykia
    password: elykia
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

elykia:
  ai:
    enabled: false

app:
  folder: /tmp/elykia-test/operations/
  credit:
    dividend: 6
  security:
    parameter:
      init-enabled: true
      init-data[0]:
        key: RESTRICT_UNIT_PRICE_VISIBILITY
        value: true
        description: "Activé : le prix unitaire et le montant de ligne sont réservés au gestionnaire et aux profils admin. Désactivé : tous les profils voient les prix unitaires."
      init-data[1]:
        key: RESTRICT_CUSTOMER_SPACE_UNIT_PRICE_VISIBILITY
        value: true
        description: "Espace client. Activé : le client ne voit ni le prix unitaire ni le montant de ligne. Désactivé : il les voit. Le total reste affiché."
      init-data[2]:
        key: RESTRICT_CASH_SALE_UNIT_PRICE_VISIBILITY
        value: true
        description: "Ventes comptant. Activé : le prix unitaire et le montant de ligne sont réservés au gestionnaire et aux profils admin. Désactivé : tous les profils les voient. Le total reste affiché."
      init-data[3]:
        key: TONTINE_ORDER_AUTO_VALIDATION
        value: false
        description: "Commandes tontine. Activé : toute commande créée passe directement au statut Validée."
      init-data[4]:
        key: RECOVERY_MONTHLY_RATE_TARGET
        value: "10"
        description: "Recouvrement terrain. Taux du mois visé par chef de recouvrement, en % (recouvré du mois / dû des retards délai). Repère du board et alerte au prorata du mois. Vide : pas d’objectif."
      init-data[5]:
        key: RECOVERY_COVERAGE_TARGET
        value: "30"
        description: "Recouvrement terrain. Part du portefeuille en cours (crédit et tontine) que chaque chef de recouvrement contrôle dans le mois, en %. Repère du board et alerte au prorata du mois. Vide : pas d’objectif."

minio:
  endpoint: http://localhost:9000
  access-key: elykia-test-access-key
  secret-key: elykia-test-secret-key

bezkoder:
  app:
    jwtSecret: elykia-test-jwt-secret-must-remain-local-and-never-be-used-outside-tests-2026
    jwtExpirationMs: 86400000
    jwtRefreshExpirationMs: 604800000

security:
  licence:
    prod:
      active: 0
      society: Elykia Test
  config:
    auto-initialize:
      enabled: false

# Les tests ne joignent pas le hub. Le défaut produit est enabled=true.
optimize:
  notification:
    hub:
      enabled: false
      oauth2:
        enabled: false
