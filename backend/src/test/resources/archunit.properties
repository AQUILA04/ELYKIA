# Spring Modulith 2.2 exclut les modules Type.OPEN du contrôle de cycles par package racine.
# Le package additionnel com.optimize.common ne contenant que des modules OPEN (entities, securities),
# ArchUnit échouerait sur « empty should » sans cette option.
# ModularityTests vérifie explicitement que les 5 modules sont non vides et que toutes leurs
# dépendances autorisées (DAG strictement acyclique) sont respectées.
archRule.failOnEmptyShould=false
