<div class="session-selector">
  <span class="toolbar-label">Session</span>
  <select class="filter-select session-year-select" [(ngModel)]="selectedSession" (ngModelChange)="onSessionChange($event)">
    <option *ngFor="let session of sessions" [ngValue]="session">{{ sessionLabel(session) }}</option>
  </select>

  <span class="session-badge" [class.active]="isOpenSession()" [class.historical]="!isOpenSession()">
    <svg *ngIf="isOpenSession()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
    <svg *ngIf="!isOpenSession()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    {{ statusLabel() }}
  </span>
</div>
