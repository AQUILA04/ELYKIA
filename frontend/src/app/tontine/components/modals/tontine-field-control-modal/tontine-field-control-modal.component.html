<div class="tontine-field-control-modal">
  <div class="modal-header">
    <h2>Contrôle terrain tontine</h2>
    <button type="button" class="close-btn" (click)="close()" [disabled]="isSubmitting" aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <div class="member-info">
      <p><strong>Membre :</strong> {{ data.memberName }}</p>
      <p class="hint">Sélectionnez les mois contrôlés et saisissez le total marqué dans le carnet pour chacun.</p>
    </div>

    <div class="months-list">
      <div class="month-row" *ngFor="let row of rows" [class.selected]="row.selected">
        <label class="month-check">
          <input
            type="checkbox"
            [checked]="row.selected"
            [disabled]="isSubmitting"
            (change)="toggleRow(row)"
          />
          <span class="month-name">{{ row.monthName }} {{ row.year }}</span>
        </label>
        <div class="month-system">
          Système : <strong>{{ row.systemAmount | number }} FCFA</strong>
        </div>
        <div class="month-input" *ngIf="row.selected">
          <label [attr.for]="'notebook-' + row.year + '-' + row.calendarMonth">Carnet</label>
          <div class="input-wrap">
            <input
              [id]="'notebook-' + row.year + '-' + row.calendarMonth"
              type="number"
              min="0"
              [(ngModel)]="row.notebookAmount"
              [disabled]="isSubmitting"
              placeholder="0"
            />
            <span class="input-suffix">FCFA</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="tontineFieldNote">Note terrain <span class="optional">(optionnel)</span></label>
      <textarea
        id="tontineFieldNote"
        class="form-control note-area"
        rows="3"
        maxlength="500"
        [(ngModel)]="note"
        [disabled]="isSubmitting"
        placeholder="Ex. : écart confirmé avec le client, mois à vérifier…"
      ></textarea>
    </div>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="isSubmitting">Annuler</button>
    <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!isValid || isSubmitting">
      {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>
</div>
