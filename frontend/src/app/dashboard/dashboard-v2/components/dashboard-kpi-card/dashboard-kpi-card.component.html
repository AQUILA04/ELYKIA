<div class="dashboard-kpi-card" [class.is-loading]="loading">
  <div class="kpi-icon" [ngClass]="data?.iconClass">
    <mat-icon>{{ data?.icon }}</mat-icon>
  </div>
  <div class="kpi-body">
    <div class="kpi-title">{{ data?.title }}</div>
    <div class="kpi-value">{{ loading ? '—' : data?.value }}</div>
    <div class="kpi-subtitle" *ngIf="data?.subtitle">{{ data?.subtitle }}</div>
  </div>
</div>
