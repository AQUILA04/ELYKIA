<div class="page-wrapper" id="main-wrapper" data-layout="vertical">

  <!-- Sidebar -->
  <div *ngIf="showHeaderAndSidebar" class="sidebar" [class.show-sidebar]="layoutService.isSidebarOpen$ | async">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Zone contenu (header sticky + contenu scrollable) -->
  <div class="body-wrapper">

    <!-- Header sticky plein largeur -->
    <app-header *ngIf="showHeaderAndSidebar"></app-header>

    <!-- Contenu principal + breadcrumb -->
    <div class="main-content">
      <app-breadcrumb *ngIf="showHeaderAndSidebar"></app-breadcrumb>
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
