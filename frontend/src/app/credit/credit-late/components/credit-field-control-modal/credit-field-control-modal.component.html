<div class="field-control-modal">
  <div class="modal-header">
    <h2>Contrôle terrain</h2>
    <button type="button" class="close-btn" (click)="close()" [disabled]="isSubmitting" aria-label="Fermer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <div class="credit-info">
      <p><strong>Référence :</strong> {{ data.credit.reference }}</p>
      <p><strong>Client :</strong> {{ data.credit.clientName }}</p>
      <p><strong>Payé système :</strong> {{ data.credit.totalAmountPaid | number }} FCFA</p>
      <p><strong>Restant dû :</strong> {{ data.credit.totalAmountRemaining | number }} FCFA</p>
    </div>

    <div class="form-group">
      <label for="notebookTotal">Total noté dans le carnet client</label>
      <div class="input-wrap">
        <input
          id="notebookTotal"
          type="number"
          min="0"
          [(ngModel)]="notebookTotalAmount"
          [disabled]="isSubmitting"
          placeholder="0"
        />
        <span class="input-suffix">FCFA</span>
      </div>
      <small class="field-hint">Saisir le cumul effectivement marqué dans le carnet</small>
    </div>

    <div class="form-group">
      <label for="fieldNote">Note terrain <span class="optional">(optionnel)</span></label>
      <textarea
        id="fieldNote"
        class="form-control note-area"
        rows="3"
        maxlength="500"
        [(ngModel)]="note"
        [disabled]="isSubmitting"
        placeholder="Ex. : montant confirmé avec le client, correction à prévoir…"
      ></textarea>
    </div>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="isSubmitting">Annuler</button>
    <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!isValid || isSubmitting">
      {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>
</div>
