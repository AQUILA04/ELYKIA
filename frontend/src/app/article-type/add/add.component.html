<div class="main-container article-type-form-page a1">
  <div class="breadcrumb-bar">
    <a routerLink="/article-type" class="breadcrumb-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
      </svg>
      Types d'article
    </a>
    <span class="date-display">{{ currentDate | date:'dd/MM/yyyy - HH:mm:ss' }}</span>
  </div>

  <div class="page-header-card a2">
    <div class="header-card-top">
      <span class="header-surtitle">RÉFÉRENTIEL ARTICLES</span>
    </div>
    <div class="header-card-main">
      <div class="title-group">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="page-icon">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <h1 class="page-title">{{ isEditMode ? 'Modifier le type' : 'Nouveau type d\'article' }}</h1>
      </div>
    </div>
    <p class="page-subtitle">
      {{ isEditMode ? 'Mettez à jour les informations du type d\'article' : 'Définissez une catégorie pour classer les articles' }}
    </p>
  </div>

  <div class="form-card a3">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label class="field-label" for="type-name">Nom <span class="req">*</span></label>
        <input
          id="type-name"
          type="text"
          class="field-input"
          formControlName="name"
          placeholder="Ex : Électroménager, Alimentaire…">
        <span class="field-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          Le nom est requis
        </span>
      </div>

      <div class="field-group">
        <label class="field-label" for="type-code">Code</label>
        <input
          id="type-code"
          type="text"
          class="field-input"
          formControlName="code"
          placeholder="Ex : ELEC, ALIM…">
      </div>

      <div class="field-group">
        <label class="field-label" for="type-description">Description</label>
        <textarea
          id="type-description"
          class="field-textarea"
          formControlName="description"
          rows="3"
          placeholder="Description optionnelle du type…"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="isLoading">Annuler</button>
        <button type="submit" class="btn-submit" [disabled]="form.invalid || isLoading">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          {{ isLoading ? 'Enregistrement…' : (isEditMode ? 'Enregistrer les modifications' : 'Créer le type') }}
        </button>
      </div>
    </form>
  </div>
</div>
