<div class="chat-input">
  @if (domains.length) {
    <div class="domain-chips">
      @for (domain of domains; track domain) {
        <button
          type="button"
          class="domain-chip"
          (click)="useDomain(domain)"
          [disabled]="disabled"
          >
          {{ domain }}
        </button>
      }
    </div>
  }

  <div class="input-row">
    <textarea
      [(ngModel)]="message"
      (keydown)="onKeydown($event)"
      [disabled]="disabled"
      rows="2"
      placeholder="Posez votre question…"
    ></textarea>
    <button type="button" class="btn-send" (click)="onSubmit()" [disabled]="disabled || !message.trim()" aria-label="Envoyer">
      <mat-icon>send</mat-icon>
    </button>
  </div>
  <div class="footer-hints">
    <p class="input-hint">Entrée pour envoyer · Maj+Entrée pour une nouvelle ligne</p>
    <p class="ai-disclaimer">L'IA peut faire des erreurs. Veuillez vérifier les informations importantes.</p>
  </div>
</div>
