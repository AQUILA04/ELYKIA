<div class="chat-input">
  <div class="domain-chips" *ngIf="domains.length">
    <button
      type="button"
      class="domain-chip"
      *ngFor="let domain of domains"
      (click)="useDomain(domain)"
      [disabled]="disabled"
    >
      {{ domain }}
    </button>
  </div>

  <div class="input-row">
    <textarea
      [(ngModel)]="message"
      (keydown)="onKeydown($event)"
      [disabled]="disabled"
      rows="2"
      placeholder="Posez votre question…"
    ></textarea>
    <button type="button" class="btn-send" (click)="onSubmit()" [disabled]="disabled || !message.trim()" aria-label="Envoyer">
      <mat-icon>send</mat-icon>
    </button>
  </div>
  <p class="input-hint">Entrée pour envoyer · Maj+Entrée pour une nouvelle ligne</p>
</div>
