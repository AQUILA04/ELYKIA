@if (breadcrumbs.length) {
  <nav>
    <ol class="breadcrumb">
      @for (breadcrumb of breadcrumbs; track breadcrumb; let last = $last) {
        <li class="breadcrumb-item" [ngClass]="{'active': last}">
          @if (!last) {
            <a [routerLink]="breadcrumb.url">{{ breadcrumb.label }}</a>
          } @else {
            {{ breadcrumb.label }}
          }
        </li>
      }
    </ol>
  </nav>
}
