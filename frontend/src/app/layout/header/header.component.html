<!-- ============================================================
     ELYKIA — Header Component
     ============================================================ -->

<header class="app-header">
  <nav class="navbar navbar-expand-lg">

    <!-- ── Left: Hamburger + Page title ── -->
    <ul class="navbar-nav">
      <!-- Mobile sidebar toggle -->
      <li class="nav-item d-block d-xl-none sidebartoggler">
        <a class="nav-link nav-icon-hover"
           href="javascript:void(0)"
           id="headerCollapse"
           (click)="toggleSidebar()">
          <i class="ti ti-menu-2"></i>
        </a>
      </li>
    </ul>

    <!-- Page breadcrumb (desktop) -->
    <div class="header-breadcrumb d-none d-md-flex ms-2">
      <span class="header-page-title">{{ pageTitle }}</span>
      <span class="header-crumb">Elykia /&nbsp;<span class="crumb-active">{{ pageTitle }}</span></span>
    </div>

    <!-- ── Right: Search + Actions + Avatar ── -->
    <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
      <ul class="navbar-nav header-right flex-row align-items-center">

        <!-- Search bar (desktop) -->
        <li class="nav-item d-none d-md-flex">
          <div class="header-search">
            <mat-icon>search</mat-icon>
            <input type="text"
                   placeholder="Rechercher..."
                   aria-label="Recherche globale"
                   (input)="onSearch($event)" />
          </div>
        </li>

        <!-- Notifications -->
        <li class="nav-item">
          <div class="icon-btn" title="Notifications">
            <mat-icon>notifications_none</mat-icon>
            <span class="notif-dot" *ngIf="hasNotifications"></span>
          </div>
        </li>

        <!-- Username (desktop) -->
        <li class="nav-item d-none d-lg-flex">
          <span class="username-display">{{ username }}</span>
        </li>

        <!-- Avatar + Dropdown -->
        <li class="nav-item avatar-dropdown" id="drop2">
          <div class="header-avatar"
               data-bs-toggle="dropdown"
               aria-expanded="false"
               role="button"
               [title]="username">
            <img src="../assets/images/profile/user-1.jpg"
                 alt="Avatar utilisateur"
                 onerror="this.style.display='none'; this.parentElement.querySelector('.avatar-initials').style.display='flex';">
            <span class="avatar-initials" style="display:none">{{ initials }}</span>
          </div>

          <!-- Dropdown menu -->
          <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
               aria-labelledby="drop2">
            <div class="message-body">

              <!-- User info row -->
              <div style="padding: 8px 12px 10px; border-bottom: 1px solid var(--border-light); margin-bottom: 6px;">
                <div style="font-size: 13px; font-weight: 700; color: var(--text-primary);">{{ username }}</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Connecté</div>
              </div>

              <!-- Profil link -->
              <a [routerLink]="['/profil']" class="dropdown-item">
                <i class="ti ti-user fs-6"></i>
                <p class="mb-0 fs-3">Mon profil</p>
              </a>

              <!-- Journal link -->
              <a [routerLink]="['/health-journal']" class="dropdown-item">
                <i class="ti ti-list-check fs-6"></i>
                <p class="mb-0 fs-3">Journal</p>
              </a>

              <div class="dropdown-divider"></div>

              <!-- Logout -->
              <button class="dropdown-logout" (click)="confirmLogout()">
                <i class="ti ti-logout"></i>
                Déconnexion
              </button>
            </div>
          </div>
        </li>

      </ul>
    </div>

  </nav>
</header>
