<div class="pdf-list-container">
  <div class="header-fixed">
    <div class="d-flex justify-content-center">
      <h1>Liste des fichiers PDF</h1>
    </div>
  </div>
  <div class="header">
    <div class="actions">
      @if (selectedFiles.length > 0) {
        <button class="btn btn-primary" (click)="downloadSelected()">
          Télécharger les fichiers sélectionnés
        </button>
      }
      @if (selectAll) {
        <button class="btn btn-primary" (click)="downloadAll()">
          Télécharger tout
        </button>
      }
    </div>
  </div>

  <table class="pdf-table">
    <thead>
      <tr>
        <th>
          @if (pdfFiles.length > 0) {
            <input type="checkbox" [(ngModel)]="selectAll" (change)="toggleSelectAll()">
          }
        </th>
        <th>Nom du fichier</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (file of pdfFiles; track file) {
        <tr>
          <td>
            <input type="checkbox"
              [checked]="selectedFiles.includes(file)"
              (change)="toggleFileSelection(file)">
          </td>
          <td>{{ file }}</td>
          <td>
            <button mat-icon-button (click)="downloadFile(file)">
              <mat-icon>download</mat-icon>
            </button>
          </td>
        </tr>
      }
      @if (pdfFiles.length < 1 ) {
        <tr> <td colspan="3">Aucun fichiers pdf Générer aujourd'hui</td></tr>
      }
    </tbody>
  </table>
</div>
