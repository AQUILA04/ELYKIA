<div class="mld-header">
  <div class="mld-icon">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="1" y="4" width="14" height="10" rx="1" />
      <path d="M5 4V3a2 2 0 0 1 4 0v1" />
    </svg>
  </div>
  <div>
    <h2 class="mld-title">Historique des mouvements</h2>
    <p class="mld-subtitle" *ngIf="data.articleName">{{ data.articleName }}</p>
    <p class="mld-subtitle" *ngIf="!data.articleName">{{ data.movements.length }} mouvement(s)</p>
  </div>
  <button class="mld-close" type="button" (click)="onClose()" aria-label="Fermer">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 3l10 10M13 3L3 13" />
    </svg>
  </button>
</div>

<div class="mld-body">
  <app-movement-table
    [movements]="data.movements"
    [limit]="data.movements.length">
  </app-movement-table>
</div>

<div class="mld-footer">
  <button type="button" class="btn btn-ghost" (click)="onClose()">Fermer</button>
</div>
