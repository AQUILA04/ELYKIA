# PROD stack — project name: elykia-prod
# Domain: elykia.amenouveve-yaveh.com
# Start:  docker compose -f docker-compose.prod.yml --project-name elykia-prod up -d
# Stop:   docker compose -f docker-compose.prod.yml --project-name elykia-prod down

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # Console UI
      - "traefik.http.routers.elykia-prod-minio-console.rule=Host(`minio.amenouveve-yaveh.com`)"
      - "traefik.http.routers.elykia-prod-minio-console.entrypoints=websecure"
      - "traefik.http.routers.elykia-prod-minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elykia-prod-minio-console.service=elykia-prod-minio-console"
      - "traefik.http.services.elykia-prod-minio-console.loadbalancer.server.port=9001"
      # API
      - "traefik.http.routers.elykia-prod-minio-api.rule=Host(`minio-api.amenouveve-yaveh.com`)"
      - "traefik.http.routers.elykia-prod-minio-api.entrypoints=websecure"
      - "traefik.http.routers.elykia-prod-minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elykia-prod-minio-api.service=elykia-prod-minio-api"
      - "traefik.http.services.elykia-prod-minio-api.loadbalancer.server.port=9000"

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elykia_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-elykia_prod_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LOGGING_FILE_PATH: /home/app/.optimize-elykia-core/logs
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL: "true"
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOKI_API_KEY: ${LOKI_API_KEY:-}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-false}
      SECURITY_CONFIG_ALLOW_ORIGIN: ${SECURITY_ALLOWED_ORIGINS:-https://elykia.amenouveve-yaveh.com,http://localhost,capacitor://localhost,http://localhost:8100,https://localhost,ionic://localhost}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-elykia-clients}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-elykia-reports}
      MINIO_MOBILE_RELEASES_BUCKET: ${MINIO_MOBILE_RELEASES_BUCKET:-elykia-mobile-releases}
      MOBILE_RELEASE_CHANNEL: ${MOBILE_RELEASE_CHANNEL:-prod}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio-api.amenouveve-yaveh.com}
      PHOTO_FALLBACK_PATH: /opt/elykia/photos/pending
    volumes:
      - ${LOG_PATH:-/opt/elykia/prod/logs}:/home/app/.optimize-elykia-core/logs
      - ${PHOTO_FALLBACK_PATH_HOST:-/opt/elykia/prod/photos/pending}:/opt/elykia/photos/pending
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # HTTPS router — higher priority (10) than frontend (1) so /api routes hit backend first
      # stripprefix removes /api before forwarding to Spring Boot (backend uses /actuator, not /api/actuator)
      - "traefik.http.routers.elykia-prod-backend.rule=Host(`elykia.amenouveve-yaveh.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.elykia-prod-backend.entrypoints=websecure"
      - "traefik.http.routers.elykia-prod-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elykia-prod-backend.priority=10"
      - "traefik.http.routers.elykia-prod-backend.middlewares=elykia-prod-strip-api"
      - "traefik.http.middlewares.elykia-prod-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.elykia-prod-backend.loadbalancer.server.port=${SERVER_PORT:-8080}"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-https://elykia.amenouveve-yaveh.com/api}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # HTTPS router — lower priority (1), catches all remaining traffic
      - "traefik.http.routers.elykia-prod-frontend.rule=Host(`elykia.amenouveve-yaveh.com`)"
      - "traefik.http.routers.elykia-prod-frontend.entrypoints=websecure"
      - "traefik.http.routers.elykia-prod-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.elykia-prod-frontend.priority=1"
      - "traefik.http.services.elykia-prod-frontend.loadbalancer.server.port=80"

volumes:
  db_data:
  minio_data:

networks:
  internal:
    name: elykia-prod-internal
    external: true
  traefik-public:
    external: true
