<ng-container *ngIf="layout.isDesktop(); else mobileView">
  <app-profile-desktop
    [session]="session"
    [appVersion]="appVersion"
    (logout)="logout()">
  </app-profile-desktop>
</ng-container>

<ng-template #mobileView>
<ion-content class="page-content profile-page" data-testid="e2e-profile-page">
  <app-elyk-page-header
    eyebrow="ESPACE CLIENT"
    title="Mon profil"
    subtitle="Vos informations et paramètres">
    <app-notification-bell
      slot="end"
      class="profile-bell"
      testId="e2e-profile-notification-bell">
    </app-notification-bell>
  </app-elyk-page-header>

  <div class="profile-body">
    <div class="profile-card elyk-animate">
      <div class="avatar" aria-hidden="true">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="profile-name" data-testid="e2e-profile-name">{{ session?.fullName }}</div>
      <div class="profile-phone" data-testid="e2e-profile-phone">{{ session?.phone }}</div>
    </div>

    <div class="about-card elyk-animate">
      <div class="about-row" data-testid="e2e-profile-version">
        <ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>
        <span>Version {{ appVersion }}</span>
      </div>
      <button
        *ngIf="!isWeb"
        type="button"
        class="about-row about-row--action"
        data-testid="e2e-profile-update-btn"
        [disabled]="updateInProgress"
        (click)="checkForAppUpdate()">
        <ion-icon name="cloud-download-outline" aria-hidden="true"></ion-icon>
        <span>{{ updateInProgress ? updateProgressLabel || 'Mise à jour...' : 'Mettre à jour l\'application' }}</span>
      </button>
    </div>

    <ion-button
      expand="block"
      color="danger"
      fill="outline"
      class="logout-btn"
      data-testid="e2e-profile-logout"
      (click)="logout()">
      Se déconnecter
    </ion-button>
  </div>
</ion-content>
<app-customer-tab-bar></app-customer-tab-bar>

</ng-template>
