<app-elyk-desktop-page eyebrow="ESPACE CLIENT" title="Mon profil" subtitle="Vos informations et paramètres" data-testid="e2e-profile-desktop">
  <div class="elyk-desktop-grid elyk-desktop-grid--2">
    <div class="desk-card" style="text-align:center;">
      <div class="avatar"><ion-icon name="person-outline"></ion-icon></div>
      <div class="profile-name" data-testid="e2e-profile-name">{{ session()?.fullName }}</div>
      <div class="profile-phone" data-testid="e2e-profile-phone">{{ session()?.phone }}</div>
    </div>
    <div class="desk-card">
      <h2 style="margin:0 0 16px;font-size:16px;">Informations</h2>
      <div class="about-row" data-testid="e2e-profile-version">
        <ion-icon name="information-circle-outline"></ion-icon>
        <span>Version {{ appVersion() }}</span>
      </div>
      <p class="desk-muted" style="margin:16px 0;">Les mises à jour de l'application sont gérées depuis le Play Store ou l'App Store sur mobile.</p>
      <ion-button expand="block" color="danger" fill="outline" data-testid="e2e-profile-logout" (click)="logout.emit()">Se déconnecter</ion-button>
    </div>
  </div>
</app-elyk-desktop-page>
