<ion-content class="page-content recovery-page" data-testid="e2e-recovery-timeline-page">
  <app-elyk-page-header
    eyebrow="MES ACHATS"
    title="Suivi des mises"
    subtitle="Visualisez chaque échéance de votre crédit"
    [showBack]="true"
    (back)="goBack()">
  </app-elyk-page-header>

  <div class="recovery-body">
    <div class="elyk-skeleton-card" *ngIf="isLoading">
      <ion-skeleton-text animated style="width: 60%; height: 16px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 90%; height: 14px; margin-top: 8px;"></ion-skeleton-text>
    </div>

    <ng-container *ngIf="!isLoading">
      <div class="pills-card elyk-animate">
        <app-recovery-pills
          data-testid="e2e-recovery-pills"
          [totalInstallments]="totalInstallments"
          [recoveries]="recoveries">
        </app-recovery-pills>
      </div>

      <div class="elyk-section-head">
        <h2>Détail des mises</h2>
      </div>

      <article
        class="timeline-item elyk-animate"
        *ngFor="let r of recoveries"
        [attr.data-testid]="'e2e-recovery-row-' + r.installmentNumber">
        <div
          class="ti-dot"
          [class.ti-dot--valide]="r.status === 'VALIDE'"
          [class.ti-dot--initie]="r.status === 'INITIE'"
          [class.ti-dot--retard]="r.status === 'RETARD'">
        </div>
        <div class="ti-content">
          <span class="ti-label">Mise #{{ r.installmentNumber }}</span>
          <span class="ti-date">{{ r.paymentDate | date:'dd/MM/yyyy' }}</span>
        </div>
        <span class="ti-amount">{{ r.amount | number:'1.0-0' }} FCFA</span>
        <span class="ti-status">{{ r.status }}</span>
      </article>
    </ng-container>
  </div>
</ion-content>

<ion-footer class="recovery-footer ion-no-border" *ngIf="nextRecovery">
  <div class="recovery-footer-inner">
    <ion-button
      expand="block"
      class="elyk-btn-gold"
      [routerLink]="['/payment', distributionId]"
      [queryParams]="paymentQueryParams()"
      data-testid="e2e-recovery-pay-btn">
      Payer la prochaine mise
    </ion-button>
  </div>
</ion-footer>
