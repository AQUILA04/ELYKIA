
<app-elyk-desktop-page
  eyebrow="ESPACE TONTINE"
  title="Historique des mises"
  subtitle="Tous vos versements déclarés"
  [showBack]="true"
  (back)="back.emit()"
  data-testid="e2e-tontine-timeline-desktop">
  <div class="elyk-skeleton-card" *ngIf="isLoading()"></div>
  <div class="elyk-table-wrap" *ngIf="!isLoading() && payments().length">
    <table class="elyk-table">
      <thead><tr><th>Date</th><th class="num">Montant</th><th>Référence</th><th>Statut</th></tr></thead>
      <tbody>
        <tr *ngFor="let p of payments()">
          <td>{{ p.collectionDate | date:'dd/MM/yyyy' }}</td>
          <td class="num">{{ p.amount | number:'1.0-0' }} F</td>
          <td>{{ p.reference || '—' }}</td>
          <td><span class="elyk-chip" [class.elyk-chip--success]="p.status==='VALIDE'" [class.elyk-chip--gold]="p.status!=='VALIDE'">{{ p.status }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="empty-state" *ngIf="!isLoading() && payments().length === 0">
    <ion-icon name="time-outline" class="empty-icon"></ion-icon>
    <p class="empty-title">Aucun versement</p>
  </div>
</app-elyk-desktop-page>
