<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end">
      <ion-button
        fill="clear"
        [disabled]="unreadCount === 0 || markingAll"
        (click)="markAllRead()"
        data-testid="e2e-notifications-mark-all">
        Tout lu
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content" data-testid="e2e-notifications-page">
  <ion-refresher slot="fixed" (ionRefresh)="load($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="page-inner" *ngIf="!isLoading && !loadError">
    <div class="notif-list" *ngIf="notifications.length > 0; else empty">
      <button
        type="button"
        class="notif-item"
        *ngFor="let n of notifications"
        [class.notif-item--unread]="!n.read"
        (click)="openNotification(n)"
        [attr.data-testid]="'e2e-notification-item-' + n.id">
        <div class="notif-icon" aria-hidden="true">
          <ion-icon [name]="iconFor(n.type)"></ion-icon>
        </div>
        <div class="notif-body">
          <div class="notif-title-row">
            <strong>{{ n.title }}</strong>
            <span class="notif-dot" *ngIf="!n.read" aria-label="Non lu"></span>
          </div>
          <p>{{ n.message }}</p>
          <time *ngIf="n.createdAt">{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</time>
        </div>
      </button>
    </div>

    <ng-template #empty>
      <div class="empty-state" data-testid="e2e-notifications-empty">
        <ion-icon name="notifications-outline" class="empty-icon"></ion-icon>
        <p class="empty-title">Aucune notification pour le moment</p>
        <p class="empty-sub">Les validations de votre agence apparaîtront ici.</p>
      </div>
    </ng-template>
  </div>

  <div class="page-inner" *ngIf="!isLoading && loadError">
    <div class="empty-state">
      <ion-icon name="cloud-offline-outline" class="empty-icon"></ion-icon>
      <p class="empty-title">Impossible de charger les notifications</p>
      <p class="empty-sub">Vérifiez votre connexion et réessayez.</p>
      <ion-button expand="block" class="elyk-btn-primary" (click)="load()">Réessayer</ion-button>
    </div>
  </div>

  <ion-spinner *ngIf="isLoading" class="center-spinner"></ion-spinner>
</ion-content>
<app-customer-tab-bar></app-customer-tab-bar>
