<ion-content class="page-content purchases-page" data-testid="e2e-purchases-page">
  <app-elyk-page-header
    eyebrow="ESPACE CLIENT"
    title="Mes achats"
    subtitle="Suivez vos commandes et vos crédits">
  </app-elyk-page-header>

  <div class="purchases-body elyk-typec-body">
    <div class="filter-card elyk-animate" data-testid="e2e-purchases-filter">
      <button
        type="button"
        class="filter-chip"
        *ngFor="let f of filters"
        [class.filter-chip--active]="statusFilter === f.value"
        (click)="setFilter(f.value)">
        {{ f.label }}
      </button>
    </div>

    <div class="elyk-skeleton-card" *ngIf="isLoading">
      <ion-skeleton-text animated style="width: 40%; height: 16px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 80%; height: 14px; margin-top: 8px;"></ion-skeleton-text>
    </div>

    <ng-container *ngIf="!isLoading">
      <a
        class="purchase-card elyk-animate"
        *ngFor="let p of filtered"
        [routerLink]="['/purchases', p.id]"
        [attr.data-testid]="'e2e-purchase-row-' + p.id">
        <div class="pc-icon" aria-hidden="true">
          <ion-icon name="bag-handle-outline"></ion-icon>
        </div>
        <div class="pc-body">
          <div class="pc-header">
            <span class="pc-ref">{{ p.reference }}</span>
            <span class="elyk-chip" [ngClass]="statusChipClass(p.status)">{{ p.status }}</span>
          </div>
          <div class="pc-meta-top">{{ p.articleCount }} article(s)</div>
          <div class="pc-amount">{{ p.totalAmount | number:'1.0-0' }} FCFA</div>
          <div class="elyk-progress" aria-hidden="true">
            <div class="elyk-progress__bar" [style.width.%]="progressPercent(p)"></div>
          </div>
          <div class="pc-meta">
            <span>{{ progressLabel(p) }}</span>
            <span>{{ p.paidInstallmentCount }}/{{ p.installmentCount }} mises</span>
          </div>
        </div>
        <ion-icon class="pc-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </a>

      <div class="empty-state elyk-animate" *ngIf="filtered.length === 0" data-testid="e2e-purchases-empty">
        <ion-icon name="receipt-outline" class="empty-icon" aria-hidden="true"></ion-icon>
        <p class="empty-title">Aucun achat trouvé</p>
        <p class="empty-sub">Vos achats à crédit apparaîtront ici.</p>
      </div>
    </ng-container>
  </div>
</ion-content>
<app-customer-tab-bar></app-customer-tab-bar>
