<ion-content class="auth-content" data-testid="e2e-auth-page">
  <div class="auth-wrapper">
    <div class="auth-logo">
      <span class="logo-text">ELYKIA</span>
      <span class="logo-sub">Espace Client</span>
    </div>

    <!-- reCAPTCHA invisible : doit exister avant sendOtp(), pas seulement à l'étape OTP -->
    <div id="recaptcha-container" aria-hidden="true"></div>

    <div class="auth-card elyk-animate">
      <button type="button" class="back-btn" *ngIf="step !== 'phone'" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <h1>{{ title }}</h1>
      <p class="subtitle">{{ subtitle }}</p>

      <!-- Étape 1 : Téléphone -->
      <form *ngIf="step === 'phone'" [formGroup]="phoneForm" (ngSubmit)="submitPhone()">
        <div class="field">
          <label>Numéro de téléphone</label>
          <div class="phone-input-row">
            <span class="phone-prefix">+228</span>
            <ion-input formControlName="phone" type="tel" inputmode="numeric"
              placeholder="90 XX XX XX XX" data-testid="e2e-auth-phone-input"></ion-input>
          </div>
        </div>
        <div class="unavailable" *ngIf="appUnavailable" data-testid="e2e-auth-unavailable">
          <ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>
          <p>{{ appUnavailableMessage }}</p>
        </div>
        <div class="error" *ngIf="error">{{ error }}</div>
        <ion-button type="submit" expand="block" class="elyk-btn-primary"
          [disabled]="phoneForm.invalid || isLoading" data-testid="e2e-auth-phone-submit">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Continuer</span>
        </ion-button>
      </form>

      <!-- Étape 2 : PIN existant -->
      <form *ngIf="step === 'pin'" [formGroup]="pinForm" (ngSubmit)="submitPin()">
        <div class="field">
          <label>Code PIN</label>
          <ion-input formControlName="pin" type="password" inputmode="numeric"
            maxlength="6" placeholder="••••" data-testid="e2e-auth-pin-input"></ion-input>
        </div>
        <div class="error" *ngIf="error">{{ error }}</div>
        <ion-button type="submit" expand="block" class="elyk-btn-primary"
          [disabled]="pinForm.invalid || isLoading" data-testid="e2e-auth-pin-submit">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Se connecter</span>
        </ion-button>
      </form>

      <!-- Étape 3 : OTP Firebase -->
      <form *ngIf="step === 'otp'" [formGroup]="otpForm" (ngSubmit)="submitOtp()">
        <div class="field">
          <label>Code reçu par SMS</label>
          <ion-input formControlName="otp" type="text" inputmode="numeric"
            maxlength="6" placeholder="123456" data-testid="e2e-auth-otp-input"></ion-input>
        </div>
        <div class="error" *ngIf="error">{{ error }}</div>
        <ion-button type="submit" expand="block" class="elyk-btn-primary"
          [disabled]="otpForm.invalid || isLoading" data-testid="e2e-auth-otp-submit">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Vérifier</span>
        </ion-button>
      </form>

      <!-- Étape 4 : Définir PIN -->
      <form *ngIf="step === 'setup-pin'" [formGroup]="setupPinForm" (ngSubmit)="submitSetupPin()">
        <div class="field">
          <label>Nouveau code PIN</label>
          <ion-input formControlName="pin" type="password" inputmode="numeric"
            maxlength="6" placeholder="••••" data-testid="e2e-auth-setup-pin-input"></ion-input>
        </div>
        <div class="field">
          <label>Confirmer le PIN</label>
          <ion-input formControlName="confirmPin" type="password" inputmode="numeric"
            maxlength="6" placeholder="••••" data-testid="e2e-auth-setup-pin-confirm"></ion-input>
        </div>
        <div class="error" *ngIf="error">{{ error }}</div>
        <ion-button type="submit" expand="block" class="elyk-btn-primary"
          [disabled]="setupPinForm.invalid || isLoading" data-testid="e2e-auth-setup-pin-submit">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Activer mon compte</span>
        </ion-button>
      </form>
    </div>

    <div class="auth-footer" data-testid="e2e-auth-version">Version {{ appVersion }}</div>
  </div>
</ion-content>
