<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 220" preserveAspectRatio="xMidYMid slice" width="390" height="220">
  <defs>
    <!-- Fond dégradé navy -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="60%" stop-color="#112236"/>
      <stop offset="100%" stop-color="#0A1520"/>
    </linearGradient>
    <!-- Dégradé doré pour les lignes -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9922A" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#F0C66A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9922A" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Dégradé de fondu bas -->
    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="bounds">
      <rect width="390" height="220"/>
    </clipPath>
  </defs>

  <!-- Fond navy -->
  <rect width="390" height="220" fill="url(#navyBg)"/>

  <!-- Grille de losanges — lignes diagonales NW→SE -->
  <g clip-path="url(#bounds)" stroke="url(#goldLine)" stroke-width="0.8" fill="none">
    <!-- Diagonales ↘ (de haut-gauche vers bas-droite) -->
    <line x1="-200" y1="0"   x2="220" y2="420"/>
    <line x1="-140" y1="0"   x2="280" y2="420"/>
    <line x1="-80"  y1="0"   x2="340" y2="420"/>
    <line x1="-20"  y1="0"   x2="400" y2="420"/>
    <line x1="40"   y1="0"   x2="460" y2="420"/>
    <line x1="100"  y1="0"   x2="520" y2="420"/>
    <line x1="160"  y1="0"   x2="580" y2="420"/>
    <line x1="220"  y1="0"   x2="640" y2="420"/>
    <line x1="280"  y1="0"   x2="700" y2="420"/>
    <line x1="340"  y1="0"   x2="760" y2="420"/>
    <line x1="400"  y1="0"   x2="820" y2="420"/>

    <!-- Diagonales ↙ (de haut-droite vers bas-gauche) -->
    <line x1="590"  y1="0"   x2="170" y2="420"/>
    <line x1="530"  y1="0"   x2="110" y2="420"/>
    <line x1="470"  y1="0"   x2="50"  y2="420"/>
    <line x1="410"  y1="0"   x2="-10" y2="420"/>
    <line x1="350"  y1="0"   x2="-70" y2="420"/>
    <line x1="290"  y1="0"   x2="-130" y2="420"/>
    <line x1="230"  y1="0"   x2="-190" y2="420"/>
    <line x1="170"  y1="0"   x2="-250" y2="420"/>
    <line x1="110"  y1="0"   x2="-310" y2="420"/>
    <line x1="50"   y1="0"   x2="-370" y2="420"/>
    <line x1="-10"  y1="0"   x2="-430" y2="420"/>
  </g>

  <!-- Fondu bas pour transition douce -->
  <rect width="390" height="220" fill="url(#fadeBottom)"/>
</svg>
