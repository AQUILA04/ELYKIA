name: Build Elykia mobile release APK
description: Ionic build, Capacitor sync, signed release APK, artifact upload

inputs:
  target:
    description: Deployment target (test or prod)
    required: true
  api-url:
    description: API base URL injected into environment.prod.ts
    required: true
  google-services-json:
    description: Contents of google-services.json
    required: true
  android-keystore-base64:
    description: Base64-encoded release keystore (optional)
    required: false
    default: ''
  android-keystore-password:
    description: Keystore password
    required: false
    default: ''
  android-key-alias:
    description: Key alias
    required: false
    default: ''
  android-key-password:
    description: Key password
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate pipeline scripts
      shell: bash
      run: |
        chmod +x .github/scripts/*.sh
        .github/scripts/validate-mobile-pipeline.sh

    - name: Inject API URL into environment.prod.ts
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
      run: |
        sed -i "s|apiUrl:.*|apiUrl: '${API_URL}',|" mobile/src/environments/environment.prod.ts

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.3'
        cache: 'npm'
        cache-dependency-path: 'mobile/package-lock.json'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies and build web assets
      shell: bash
      run: |
        set -euo pipefail
        cd mobile
        npm cache clean --force
        npm install --legacy-peer-deps
        npx playwright install --with-deps chromium || true
        npm install -g @ionic/cli @capacitor/cli
        npm run test:e2e || true
        ionic build --prod
        npx cap add android || true

    - name: Write google-services.json
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        set -euo pipefail
        mkdir -p mobile/android/app
        printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
        python3 -m json.tool mobile/android/app/google-services.json > /dev/null

    - name: Sync Capacitor and apply Android config
      shell: bash
      run: |
        set -euo pipefail
        cd mobile
        npx cap sync android
        mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
        cp ../.github/workflows/android-config-prod/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
        cp ../.github/workflows/android-config-prod/config.xml android/app/src/main/res/xml/config.xml
        cp ../.github/workflows/android-config-prod/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
        cp ../.github/workflows/android-config-prod/file_paths.xml android/app/src/main/res/xml/file_paths.xml
        ../.github/scripts/patch-android-status-bar-styles.sh android/app/src/main/res/values/styles.xml
        ../.github/scripts/configure-android-firebase.sh android

    - name: Prepare Android keystore
      shell: bash
      env:
        AND_KS_BASE64: ${{ inputs.android-keystore-base64 }}
        STORE_PASSWORD: ${{ inputs.android-keystore-password }}
        KEY_ALIAS: ${{ inputs.android-key-alias }}
        KEY_PASSWORD: ${{ inputs.android-key-password }}
      run: |
        set -euo pipefail
        if [ -z "$AND_KS_BASE64" ]; then
          echo "No keystore provided — unsigned release APK"
          exit 0
        fi
        echo "$AND_KS_BASE64" | base64 --decode > mobile/android/keystore.jks
        printf '%s\n' \
          'storeFile=../keystore.jks' \
          "storePassword=${STORE_PASSWORD}" \
          "keyAlias=${KEY_ALIAS}" \
          "keyPassword=${KEY_PASSWORD}" \
          > mobile/android/key.properties

    - name: Configure Android release signing
      shell: bash
      run: .github/scripts/configure-android-signing.sh mobile/android

    - name: Build Android release APK
      shell: bash
      run: |
        set -euo pipefail
        chmod +x mobile/android/gradlew
        cd mobile/android
        ./gradlew clean assembleRelease

    - name: Rename APK and set artifact path
      id: apk
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        VERSION=$(grep "version:" mobile/src/environments/environment.ts | head -n1 | sed "s/.*version: '\([^']*\)'.*/\1/")
        if [ -z "$VERSION" ]; then
          echo "Could not detect app version" >&2
          exit 1
        fi
        echo "Detected version: $VERSION"
        echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
        bash .github/scripts/resolve-release-apk.sh \
          "mobile/android/app/build/outputs/apk/release" \
          "elykia-mobile-${TARGET}-v${VERSION}.apk" | tee /tmp/apk-resolve.log
        APK_PATH=$(grep '^APK_PATH=' /tmp/apk-resolve.log | cut -d= -f2-)
        echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: elykia-mobile-${{ inputs.target }}-v${{ steps.apk.outputs.app_version }}.apk
        path: ${{ steps.apk.outputs.apk_path }}
        retention-days: 90
