name: Build Elykia customer-space release APK
description: Ionic build, Capacitor sync, signed release APK, artifact upload

inputs:
  target:
    description: Deployment target (test or prod)
    required: true
  api-url:
    description: API base URL injected into environment.prod.ts
    required: true
  google-services-json:
    description: Contents of google-services.json
    required: true
  android-keystore-base64:
    description: Base64-encoded release keystore (optional)
    required: false
    default: ''
  android-keystore-password:
    description: Keystore password
    required: false
    default: ''
  android-key-alias:
    description: Key alias
    required: false
    default: ''
  android-key-password:
    description: Key password
    required: false
    default: ''
  minio-endpoint:
    description: MinIO API endpoint for APK publishing (optional)
    required: false
    default: ''
  minio-access-key:
    description: MinIO access key for APK publishing
    required: false
    default: ''
  minio-secret-key:
    description: MinIO secret key for APK publishing
    required: false
    default: ''
  minio-customer-space-releases-bucket:
    description: MinIO bucket for customer-space releases
    required: false
    default: 'elykia-customer-space-releases'

runs:
  using: composite
  steps:
    - name: Validate pipeline scripts
      shell: bash
      run: |
        chmod +x .github/scripts/*.sh
        .github/scripts/validate-customer-space-pipeline.sh

    - name: Inject API URL into environment.prod.ts
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
      run: |
        sed -i "s|apiUrl:.*|apiUrl: '${API_URL}',|" customer-space/src/environments/environment.prod.ts

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.19.3'
        cache: 'npm'
        cache-dependency-path: 'customer-space/package-lock.json'

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install dependencies and build web assets
      shell: bash
      run: |
        set -euo pipefail
        cd customer-space
        npm ci
        node scripts/ensure-firebase-config.mjs
        node scripts/sync-app-version.mjs
        node scripts/apply-firebase-config.mjs --profile prod
        npx playwright install --with-deps chromium || true
        npm install -g @ionic/cli @capacitor/cli
        npm run test:e2e:smoke || true
        ionic build --prod
        npx cap add android || true

    - name: Write google-services.json
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: |
        set -euo pipefail
        mkdir -p customer-space/android/app
        printf '%s' "$GOOGLE_SERVICES_JSON" > customer-space/android/app/google-services.json
        python3 -m json.tool customer-space/android/app/google-services.json > /dev/null

    - name: Sync Capacitor and apply Android config
      shell: bash
      run: |
        set -euo pipefail
        cd customer-space
        npx cap sync android
        mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
        cp ../.github/workflows/android-config-customer-space/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
        cp ../.github/workflows/android-config-customer-space/config.xml android/app/src/main/res/xml/config.xml
        cp ../.github/workflows/android-config-customer-space/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
        cp ../.github/workflows/android-config-customer-space/file_paths.xml android/app/src/main/res/xml/file_paths.xml
        ../.github/scripts/patch-android-status-bar-styles.sh android/app/src/main/res/values/styles.xml
        ../.github/scripts/sync-android-version.sh android
        ../.github/scripts/install-customer-space-app-update-plugin.sh android

    - name: Prepare Android keystore
      shell: bash
      env:
        AND_KS_BASE64: ${{ inputs.android-keystore-base64 }}
        STORE_PASSWORD: ${{ inputs.android-keystore-password }}
        KEY_ALIAS: ${{ inputs.android-key-alias }}
        KEY_PASSWORD: ${{ inputs.android-key-password }}
      run: |
        set -euo pipefail
        if [ -z "$AND_KS_BASE64" ]; then
          echo "No keystore provided — unsigned release APK"
          exit 0
        fi
        echo "$AND_KS_BASE64" | base64 --decode > customer-space/android/keystore.jks
        printf '%s\n' \
          'storeFile=../keystore.jks' \
          "storePassword=${STORE_PASSWORD}" \
          "keyAlias=${KEY_ALIAS}" \
          "keyPassword=${KEY_PASSWORD}" \
          > customer-space/android/key.properties

    - name: Configure Android release signing
      shell: bash
      run: .github/scripts/configure-android-signing.sh customer-space/android

    - name: Build Android release APK
      shell: bash
      run: |
        set -euo pipefail
        chmod +x customer-space/android/gradlew
        cd customer-space/android
        if [ -f gradle.properties ]; then
          sed -i '/org.gradle.jvmargs/d' gradle.properties
          sed -i '/org.gradle.daemon/d' gradle.properties
        fi
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        ./gradlew clean assembleRelease --stacktrace

    - name: Rename APK and set artifact path
      id: apk
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./customer-space/package.json').version")
        if [ -z "$VERSION" ]; then
          echo "Could not detect app version" >&2
          exit 1
        fi
        echo "Detected version: $VERSION"
        echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
        bash .github/scripts/resolve-release-apk.sh \
          "customer-space/android/app/build/outputs/apk/release" \
          "elykia-customer-${TARGET}-v${VERSION}.apk" | tee /tmp/apk-resolve.log
        APK_PATH=$(grep '^APK_PATH=' /tmp/apk-resolve.log | cut -d= -f2-)
        echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v6
      with:
        name: elykia-customer-${{ inputs.target }}-v${{ steps.apk.outputs.app_version }}.apk
        path: ${{ steps.apk.outputs.apk_path }}
        retention-days: 90

    - name: Publish APK to MinIO
      if: inputs.minio-endpoint != '' && inputs.minio-access-key != '' && inputs.minio-secret-key != ''
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ inputs.minio-endpoint }}
        MINIO_ACCESS_KEY: ${{ inputs.minio-access-key }}
        MINIO_SECRET_KEY: ${{ inputs.minio-secret-key }}
        MINIO_CUSTOMER_SPACE_RELEASES_BUCKET: ${{ inputs.minio-customer-space-releases-bucket }}
      run: |
        set -euo pipefail
        chmod +x .github/scripts/publish-customer-space-apk.sh
        .github/scripts/publish-customer-space-apk.sh \
          "${{ steps.apk.outputs.apk_path }}" \
          "${{ inputs.target }}" \
          "${{ steps.apk.outputs.app_version }}"
