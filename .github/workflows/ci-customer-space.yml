name: ELYKIA CI Customer Space Pipeline

# Customer-space CI is decoupled from the deploy gate (ci.yml).
# A customer-space failure does not block CD.
#
# Path detection:
#   pull_request → dorny/paths-filter vs PR base
#   push → since last successful build-customer-space job (not last push only).

on:
  push:
    branches: [ main, develop, 'release/**', 'prod/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      customer_space: ${{ steps.filter.outputs.customer_space || steps.push.outputs.customer_space }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: dorny/paths-filter@v4
      id: filter
      if: github.event_name == 'pull_request'
      with:
        filters: |
          customer_space:
            - 'customer-space/**'
            - '.github/workflows/ci-customer-space.yml'
            - '.github/workflows/build-customer-space-apk.yml'
            - '.github/actions/build-customer-space-apk/**'
            - '.github/workflows/android-config-customer-space/**'
            - '.github/scripts/publish-customer-space-apk.sh'
            - '.github/scripts/validate-customer-space-pipeline.sh'
            - '.github/scripts/install-customer-space-app-update-plugin.sh'

    - name: Detect customer-space changes since last successful build
      id: push
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        WORKFLOW_FILE: ci-customer-space.yml
        HEAD_SHA: ${{ github.sha }}
        HEAD_BRANCH: ${{ github.ref_name }}
        JOB_NAME: build-customer-space
      run: |
        set -euo pipefail
        chmod +x .github/scripts/detect-path-changes-since-last-success.sh
        result=$(.github/scripts/detect-path-changes-since-last-success.sh \
          'customer-space/**' \
          '.github/workflows/ci-customer-space.yml' \
          '.github/workflows/build-customer-space-apk.yml' \
          '.github/actions/build-customer-space-apk/**' \
          '.github/workflows/android-config-customer-space/**' \
          '.github/scripts/publish-customer-space-apk.sh' \
          '.github/scripts/validate-customer-space-pipeline.sh' \
          '.github/scripts/install-customer-space-app-update-plugin.sh')
        echo "customer_space=$result" >> "$GITHUB_OUTPUT"

  test-customer-space:
    needs: changes
    if: ${{ needs.changes.outputs.customer_space == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer-space
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'customer-space/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Prepare environment files
      run: node scripts/ensure-firebase-config.mjs && node scripts/sync-app-version.mjs

    - name: Run unit tests
      run: npm run test:unit

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        CI: true

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: playwright-report-customer-space
        path: customer-space/playwright-report/
        retention-days: 14

  build-customer-space:
    needs: changes
    if: ${{ needs.changes.outputs.customer_space == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer-space
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Validate APK pipeline scripts
      working-directory: .
      run: |
        chmod +x .github/scripts/*.sh
        .github/scripts/validate-customer-space-pipeline.sh

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'customer-space/package-lock.json'

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # Le paquet historique "tools" n'existe plus (cmdline-tools 16+/20+) → "Failed to find package 'tools'"
        packages: 'platform-tools'

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses >/tmp/android-licenses.log 2>&1 || true

    - name: Install dependencies
      run: npm ci

    - name: Prepare environment files
      run: node scripts/ensure-firebase-config.mjs && node scripts/sync-app-version.mjs

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Smoke Tests
      run: npm run test:e2e:smoke
      env:
        CI: true

    # Prefer lockfile-local CLIs (@angular/cli + @capacitor/cli from npm ci).
    # Unpinned `npm install -g @ionic/cli` can 404 on @types/node@* (latest).
    - name: Build Ionic app
      run: npm run build -- --configuration=production

    - name: Add Android platform
      run: ./node_modules/.bin/cap add android

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOMER_SPACE_GOOGLE_SERVICES_JSON }}
      run: |
        set -euo pipefail
        mkdir -p android/app
        if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
        else
          echo "WARN: CUSTOMER_SPACE_GOOGLE_SERVICES_JSON is empty — skipping google-services.json"
          echo "(debug APK without native Google Services plugin; set the secret for Firebase-enabled builds)"
          rm -f android/app/google-services.json
        fi

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Apply Android configuration
      run: |
        mkdir -p android/app/src/main/res/xml
        cp ../.github/workflows/android-config-customer-space/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
        cp ../.github/workflows/android-config-customer-space/config.xml android/app/src/main/res/xml/config.xml
        cp ../.github/workflows/android-config-customer-space/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
        cp ../.github/workflows/android-config-customer-space/file_paths.xml android/app/src/main/res/xml/file_paths.xml
        ../.github/scripts/install-customer-space-app-update-plugin.sh android

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        if [ -f gradle.properties ]; then
          sed -i '/org.gradle.jvmargs/d' gradle.properties
          sed -i '/org.gradle.daemon/d' gradle.properties
        fi
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        ./gradlew assembleDebug --stacktrace

    - name: Extract App Version and Rename APK
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "Detected version: $VERSION"
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/elykia-customer-dev-v$VERSION.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v6
      with:
        name: elykia-customer-dev-v${{ env.APP_VERSION }}.apk
        path: customer-space/android/app/build/outputs/apk/debug/elykia-customer-dev-v${{ env.APP_VERSION }}.apk
        retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 10 }}

  build-customer-space-prod:
    needs: [changes, test-customer-space]
    if: ${{ needs.changes.outputs.customer_space == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer-space
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'customer-space/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Prepare environment files
      run: node scripts/ensure-firebase-config.mjs && node scripts/sync-app-version.mjs

    - name: Apply Firebase configuration
      env:
        CUSTOMER_SPACE_GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOMER_SPACE_GOOGLE_SERVICES_JSON }}
        CUSTOMER_SPACE_FIREBASE_WEB_CONFIG: ${{ secrets.CUSTOMER_SPACE_FIREBASE_WEB_CONFIG }}
      run: node scripts/apply-firebase-config.mjs --profile prod

    - name: Production build
      run: npm run build -- --configuration=production
