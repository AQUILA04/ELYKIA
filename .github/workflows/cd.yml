name: ELYKIA CD Pipeline

# This workflow runs after the CI deploy workflow ("ELYKIA CI Pipeline") completes successfully.
# Mobile CI (ci-mobile.yml) is decoupled and does not block deployment.
# Customer-space CI (ci-customer-space.yml) is decoupled and does not block deployment.
# It deploys to 'test' when CI ran on branch 'main', and to 'prod' when CI ran on branches matching 'prod/**'.
# Mobile APK builds run in build-mobile-apk.yml after CD and ci-mobile both succeed for the same commit.
# Customer-space APK builds run in build-customer-space-apk.yml after CD and ci-customer-space both succeed.
# Web E2E tests (Playwright) run in parallel in e2e.yml after a successful TEST deploy.
# It also supports a manual 'promote' workflow_dispatch to promote the current test release to prod,
# then stop the test stack once prod deploy has succeeded.
#
# IMAGE RESOLUTION STRATEGY
# --------------------------
# The CI only rebuilds an image when the corresponding source directory changes.
# This means the current commit SHA may not have a matching image in GHCR if only
# infra/config files (e.g. deploy/) were modified.
#
# To handle this correctly, the CD resolves the *last commit SHA that actually
# produced an image* for each component by walking back through git history and
# checking GHCR for the first existing tag. This way:
#   - A pure deploy/ change deploys the last known-good images unchanged.
#   - A backend-only change deploys the new backend + last known-good frontend.
#   - Both changed → both new images are deployed.
#
# When deploy/ changed since the last successful CD deploy for that target
# (TEST on main, PROD on prod/**), CD runs deploy.sh with -fu so the server
# scripts under /opt/elykia/deploy are refreshed from main before compose up.
# The window is last-successful-CD-head..current-head (not only the last push),
# so a deploy/ change in a CI-failed commit is still picked up by the next green CD.
#
on:
  workflow_run:
    workflows: ["ELYKIA CI Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        type: choice
        required: true
        default: promote
        options:
          - promote

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the last published image SHA for each component
  # ---------------------------------------------------------------------------
  resolve-images:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'prod/'))
    runs-on: ubuntu-latest
    outputs:
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      website_image: ${{ steps.resolve.outputs.website_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve last published image for each component
        id: resolve
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io"

          # Log in to GHCR so we can check tag existence
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

          # Prod branches may have little or no unique history; keep main reachable as fallback.
          git fetch origin main --depth=200 2>/dev/null || git fetch origin main 2>/dev/null || true

          # Walk back through recent commits and return the first SHA for which an image tag exists in GHCR.
          resolve_sha() {
            local component="$1"   # e.g. "backend" or "frontend"
            local image="$REGISTRY/$REPO_LOWER-$component"
            local start_sha sha

            for start_sha in "$HEAD_SHA" "origin/main" "main"; do
              if ! git rev-parse --verify "${start_sha}^{commit}" >/dev/null 2>&1; then
                continue
              fi
              echo "Searching $component image in history of $start_sha" >&2
              while read -r sha; do
                if docker manifest inspect "$image:$sha" > /dev/null 2>&1; then
                  echo "Resolved $component from $start_sha history: $image:$sha" >&2
                  echo "$image:$sha"
                  return 0
                fi
              done < <(git log --format='%H' "$start_sha" | head -100)
            done

            echo "ERROR: No published image found for $component in the last 100 commits (tried $HEAD_SHA, origin/main, main)" >&2
            return 1
          }

          FRONTEND_IMAGE=$(resolve_sha "frontend")
          BACKEND_IMAGE=$(resolve_sha "backend")
          WEBSITE_IMAGE=$(resolve_sha "website" || echo "")

          echo "Resolved frontend: $FRONTEND_IMAGE"
          echo "Resolved backend:  $BACKEND_IMAGE"
          echo "Resolved website:  $WEBSITE_IMAGE"

          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "backend_image=$BACKEND_IMAGE"  >> "$GITHUB_OUTPUT"
          echo "website_image=$WEBSITE_IMAGE"  >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Detect deploy/ changes since the last successful CD deploy (not last push only)
  # ---------------------------------------------------------------------------
  detect-deploy-changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'prod/'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      force_update: ${{ steps.detect.outputs.force_update }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect deploy folder changes since last successful CD
        id: detect
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'

          if [ "$HEAD_BRANCH" = "main" ]; then
            DEPLOY_JOB_NAME='Deploy to TEST after CI'
          else
            DEPLOY_JOB_NAME='Deploy to PROD after CI'
          fi

          # Last CD workflow_run that successfully ran the target deploy job.
          # Window BASE..HEAD covers deploy/ edits in CI-failed commits that never got a CD.
          find_last_deploy_sha() {
            local page=1
            while [ "$page" -le 5 ]; do
              local run_id run_sha run_branch job_id
              while IFS=$'\t' read -r run_id run_sha run_branch; do
                [ -z "${run_id:-}" ] && continue
                if [ "$HEAD_BRANCH" = "main" ]; then
                  [ "$run_branch" = "main" ] || continue
                else
                  case "$run_branch" in
                    prod/*) ;;
                    *) continue ;;
                  esac
                fi
                # Skip a run whose head is the commit we are about to deploy (should not
                # appear as completed yet, but guard anyway).
                if [ "$run_sha" = "$HEAD_SHA" ]; then
                  continue
                fi
                job_id=$(gh api "/repos/$REPO/actions/runs/${run_id}/jobs" --paginate \
                  --jq ".jobs[] | select(.name == \"${DEPLOY_JOB_NAME}\" and .conclusion == \"success\") | .id" \
                  | head -1 || true)
                if [ -n "${job_id:-}" ]; then
                  echo "Last successful CD deploy: run_id=$run_id sha=$run_sha job=$DEPLOY_JOB_NAME" >&2
                  echo "$run_sha"
                  return 0
                fi
              done < <(gh api "/repos/$REPO/actions/workflows/cd.yml/runs?event=workflow_run&status=completed&per_page=30&page=$page" \
                --jq '.workflow_runs[] | select(.conclusion == "success") | [.id, .head_sha, .head_branch] | @tsv')
              page=$((page + 1))
            done
            return 1
          }

          BASE_SHA=$(find_last_deploy_sha || true)
          if [ -z "${BASE_SHA:-}" ]; then
            BASE_SHA="${HEAD_SHA}^1"
            echo "No prior successful CD deploy found; falling back to first-parent BASE=$BASE_SHA" >&2
          fi

          echo "Detect mode=since-last-cd BASE=$BASE_SHA HEAD=$HEAD_SHA branch=$HEAD_BRANCH job=$DEPLOY_JOB_NAME"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- deploy/ || true)
          if [ -n "$CHANGED" ]; then
            echo "deploy/ changed since last successful CD:"
            echo "$CHANGED"
            echo "force_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy/ changes between $BASE_SHA and $HEAD_SHA"
            echo "force_update=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Deploy to TEST
  # ---------------------------------------------------------------------------
  deploy-test:
    needs: [resolve-images, detect-deploy-changes]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    name: Deploy to TEST after CI
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to test server
        run: |
          set -euo pipefail
          FRONTEND_IMAGE='${{ needs.resolve-images.outputs.frontend_image }}'
          BACKEND_IMAGE='${{ needs.resolve-images.outputs.backend_image }}'
          DEPLOY_FORCE_UPDATE=""
          if [ "${{ needs.detect-deploy-changes.outputs.force_update }}" = "true" ]; then
            DEPLOY_FORCE_UPDATE="-fu"
            echo "deploy/ changed since last successful CD → forcing deploy scripts update (-fu)"
          fi
          echo "Deploying $FRONTEND_IMAGE and $BACKEND_IMAGE to test"
          echo "TEST_SERVER_USER:" $(echo '${{ secrets.TEST_SERVER_USER }}' | sed 's/./& /g')
          echo "TEST_SERVER_HOST:" $(echo '${{ secrets.TEST_SERVER_HOST }}' | sed 's/./& /g')
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} \
            "export GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             && cd ${{ secrets.TEST_DEPLOY_PATH }} \
             && ./deploy/deploy.sh $DEPLOY_FORCE_UPDATE test '$FRONTEND_IMAGE' '$BACKEND_IMAGE'"

      - name: Deploy website to test
        if: ${{ needs.resolve-images.outputs.website_image != '' }}
        run: |
          WEBSITE_IMAGE='${{ needs.resolve-images.outputs.website_image }}'
          echo "Deploying website $WEBSITE_IMAGE to test (site.amenouveve-yaveh.com)"
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} \
            "export GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             && cd ${{ secrets.TEST_DEPLOY_PATH }} \
             && ./deploy/deploy-website.sh test '$WEBSITE_IMAGE'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key

  # ---------------------------------------------------------------------------
  # Deploy to PROD
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: [resolve-images, detect-deploy-changes]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'prod/')
    runs-on: ubuntu-latest
    name: Deploy to PROD after CI
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to prod server
        run: |
          set -euo pipefail
          FRONTEND_IMAGE='${{ needs.resolve-images.outputs.frontend_image }}'
          BACKEND_IMAGE='${{ needs.resolve-images.outputs.backend_image }}'
          DEPLOY_FORCE_UPDATE=""
          if [ "${{ needs.detect-deploy-changes.outputs.force_update }}" = "true" ]; then
            DEPLOY_FORCE_UPDATE="-fu"
            echo "deploy/ changed since last successful CD → forcing deploy scripts update (-fu)"
          fi
          echo "Deploying $FRONTEND_IMAGE and $BACKEND_IMAGE to prod"
          echo "PROD_SERVER_USER:" $(echo '${{ secrets.PROD_SERVER_USER }}' | sed 's/./& /g')
          echo "PROD_SERVER_HOST:" $(echo '${{ secrets.PROD_SERVER_HOST }}' | sed 's/./& /g')
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "export GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             && cd ${{ secrets.PROD_DEPLOY_PATH }} \
             && ./deploy/deploy.sh $DEPLOY_FORCE_UPDATE prod '$FRONTEND_IMAGE' '$BACKEND_IMAGE'"

      - name: Deploy website to prod
        if: ${{ needs.resolve-images.outputs.website_image != '' }}
        run: |
          WEBSITE_IMAGE='${{ needs.resolve-images.outputs.website_image }}'
          echo "Deploying website $WEBSITE_IMAGE to prod (www.amenouveve-yaveh.com)"
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "export GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             && cd ${{ secrets.PROD_DEPLOY_PATH }} \
             && ./deploy/deploy-website.sh prod '$WEBSITE_IMAGE'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key

  # ---------------------------------------------------------------------------
  # Promote TEST → PROD (manual dispatch)
  # ---------------------------------------------------------------------------
  promote-fetch-test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote'
    runs-on: ubuntu-latest
    name: Fetch current test release
    environment: test
    outputs:
      frontend_image: ${{ steps.fetch.outputs.frontend_image }}
      backend_image: ${{ steps.fetch.outputs.backend_image }}
    steps:
      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Fetch current test release images
        id: fetch
        run: |
          set -euo pipefail
          TEST_HOST="${{ secrets.TEST_SERVER_HOST }}"
          TEST_USER="${{ secrets.TEST_SERVER_USER }}"
          
          ssh -o StrictHostKeyChecking=no -i private_key "$TEST_USER@$TEST_HOST" "cat /opt/elykia/test/releases/test_current.txt" > release.txt
          cat release.txt
          FRONTEND_IMAGE=$(grep '^FRONTEND_IMAGE=' release.txt | cut -d= -f2-)
          BACKEND_IMAGE=$(grep '^BACKEND_IMAGE=' release.txt | cut -d= -f2-)
          
          if [ -z "$FRONTEND_IMAGE" ] || [ -z "$BACKEND_IMAGE" ]; then
            echo "Could not determine images to promote" >&2
            exit 2
          fi
          
          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "backend_image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: rm -f private_key release.txt

  promote-deploy-prod:
    needs: promote-fetch-test
    runs-on: ubuntu-latest
    name: Promote test -> prod
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Detect deploy folder changes since test release
        id: detect
        env:
          FRONTEND_IMAGE: ${{ needs.promote-fetch-test.outputs.frontend_image }}
        run: |
          set -euo pipefail
          BASE_SHA="${FRONTEND_IMAGE##*:}"
          git fetch origin main
          echo "Promote detect: BASE(test image sha)=$BASE_SHA HEAD=origin/main"
          CHANGED=$(git diff --name-only "$BASE_SHA" origin/main -- deploy/ || true)
          if [ -n "$CHANGED" ]; then
            echo "deploy/ changed on main since test release $BASE_SHA:"
            echo "$CHANGED"
            echo "force_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy/ changes between test release $BASE_SHA and origin/main"
            echo "force_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to prod server
        run: |
          set -euo pipefail
          PROD_HOST="${{ secrets.PROD_SERVER_HOST }}"
          PROD_USER="${{ secrets.PROD_SERVER_USER }}"
          PROD_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
          FRONTEND_IMAGE="${{ needs.promote-fetch-test.outputs.frontend_image }}"
          BACKEND_IMAGE="${{ needs.promote-fetch-test.outputs.backend_image }}"
          DEPLOY_FORCE_UPDATE=""
          if [ "${{ steps.detect.outputs.force_update }}" = "true" ]; then
            DEPLOY_FORCE_UPDATE="-fu"
            echo "deploy/ changed since test release → forcing deploy scripts update (-fu)"
          fi
          
          echo "Promoting FRONTEND_IMAGE=$FRONTEND_IMAGE BACKEND_IMAGE=$BACKEND_IMAGE to prod ($PROD_HOST)"
          ssh -o StrictHostKeyChecking=no -i private_key "$PROD_USER@$PROD_HOST" \
            "export GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
             && cd $PROD_PATH \
             && ./deploy/deploy.sh $DEPLOY_FORCE_UPDATE prod '$FRONTEND_IMAGE' '$BACKEND_IMAGE'"

      - name: Cleanup
        if: always()
        run: rm -f private_key

  # ---------------------------------------------------------------------------
  # Stop TEST stack after successful promote to PROD
  # ---------------------------------------------------------------------------
  promote-stop-test:
    needs: promote-deploy-prod
    runs-on: ubuntu-latest
    name: Stop test stack after promote
    environment: test
    steps:
      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Stop test stack
        env:
          TEST_USER: ${{ secrets.TEST_SERVER_USER }}
          TEST_HOST: ${{ secrets.TEST_SERVER_HOST }}
          TEST_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${TEST_USER:?Missing TEST_SERVER_USER}"
          : "${TEST_HOST:?Missing TEST_SERVER_HOST}"
          : "${TEST_PATH:?Missing TEST_DEPLOY_PATH}"

          echo "Prod promote succeeded → stopping test stack on $TEST_HOST"
          ssh -o StrictHostKeyChecking=no -i private_key "$TEST_USER@$TEST_HOST" \
            "cd '$TEST_PATH/deploy' \
             && docker compose -f docker-compose.test.yml --project-name elykia-test --env-file /opt/elykia/test/.env down"

      - name: Cleanup
        if: always()
        run: rm -f private_key
