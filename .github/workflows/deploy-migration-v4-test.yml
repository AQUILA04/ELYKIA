name: Deploy migration-v4 to TEST

# Temporary validation pipeline for the Java 25 / Spring Boot 4 / Spring Modulith migration.
# Triggers ONLY on branch 'migration-v4' and deploys ONLY to the TEST environment.
# NEVER deploys to PROD (no prod job, no PROD_* secrets).
# Remove this workflow once 'migration-v4' has been validated and merged into 'main'.

on:
  push:
    branches: [ migration-v4 ]
  workflow_dispatch:

concurrency:
  group: deploy-migration-v4-test
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    if: github.ref_name == 'migration-v4'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image.outputs.backend_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          BACKEND_IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}-backend:${{ github.sha }}"
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME_LOWER}" >> "$GITHUB_ENV"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run backend quality gate
        run: mvn -B verify --file backend/pom.xml

      - name: Publish JaCoCo coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-jacoco-migration-v4-${{ github.run_id }}
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image (migration-v4)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend:migration-v4

  resolve-frontend-from-main:
    if: github.ref_name == 'migration-v4'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve latest published frontend image from main
        id: resolve
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${REPO_LOWER}-frontend"

          echo "$GHCR_TOKEN" | docker login "${{ env.REGISTRY }}" -u "$GHCR_USERNAME" --password-stdin
          git fetch origin main --depth=200 2>/dev/null || git fetch origin main

          while read -r sha; do
            if docker manifest inspect "${IMAGE}:${sha}" > /dev/null 2>&1; then
              echo "Resolved frontend image from main: ${IMAGE}:${sha}"
              echo "frontend_image=${IMAGE}:${sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(git log --format='%H' origin/main | head -100)

          echo "ERROR: No published frontend image found in the last 100 commits of origin/main" >&2
          exit 1

  deploy-test:
    needs: [build-backend, resolve-frontend-from-main]
    if: github.ref_name == 'migration-v4'
    runs-on: ubuntu-latest
    name: Deploy migration-v4 backend to TEST
    environment: test
    steps:
      - name: Prepare SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy backend (migration-v4) + frontend (main) to TEST server with health check & rollback
        env:
          FRONTEND_IMAGE: ${{ needs.resolve-frontend-from-main.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.backend_image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TEST_DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "Deploying TEST stack:"
          echo "  FRONTEND_IMAGE=${FRONTEND_IMAGE} (from main)"
          echo "  BACKEND_IMAGE=${BACKEND_IMAGE} (from migration-v4)"
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} \
            "bash -s -- '${TEST_DEPLOY_PATH}' '${FRONTEND_IMAGE}' '${BACKEND_IMAGE}' '${GHCR_USERNAME}' '${GHCR_TOKEN}'" <<'REMOTE_EOF'
          set -euo pipefail
          TEST_DEPLOY_PATH="$1"
          FRONTEND_IMAGE="$2"
          BACKEND_IMAGE="$3"
          export GHCR_USERNAME="$4"
          export GHCR_TOKEN="$5"

          cd "$TEST_DEPLOY_PATH"

          PREV_RELEASE=""
          if [[ -e /opt/elykia/test/releases/test_current.txt ]]; then
            PREV_RELEASE=$(readlink -f /opt/elykia/test/releases/test_current.txt || true)
          fi
          echo "Previous TEST release: ${PREV_RELEASE:-none}"

          ./deploy/deploy.sh test "$FRONTEND_IMAGE" "$BACKEND_IMAGE"

          # Verify backend /actuator/health (safe even before main updates /opt/elykia/deploy/deploy.sh)
          PORT=8080
          if [[ -f /opt/elykia/test/.env ]]; then
            ENV_PORT=$(grep '^SERVER_PORT=' /opt/elykia/test/.env | tail -n1 | cut -d= -f2- || true)
            [[ -n "$ENV_PORT" ]] && PORT="$ENV_PORT"
          fi

          probe_health() {
            local cid="$1"
            local ip body=""
            ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$cid" 2>/dev/null | awk '{print $1}' || true)
            if [[ -n "$ip" ]] && command -v curl >/dev/null 2>&1; then
              body=$(curl -fsS --max-time 3 "http://${ip}:${PORT}/actuator/health" 2>/dev/null || true)
            fi
            if [[ -z "$body" ]]; then
              body=$(docker exec "$cid" bash -c "exec 3<>/dev/tcp/127.0.0.1/${PORT} && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3" 2>/dev/null || true)
            fi
            echo "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
          }

          echo "Waiting 10s for backend startup before polling /actuator/health..."
          sleep 10
          ELAPSED=10
          TIMEOUT=90
          HEALTHY=false
          while (( ELAPSED <= TIMEOUT )); do
            CID=$(docker ps -aqf 'name=^elykia-test-backend$' | head -n1 || true)
            if [[ -z "$CID" ]]; then
              echo "ERROR: container elykia-test-backend not found" >&2
              break
            fi
            STATUS=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || echo unknown)
            RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CID" 2>/dev/null || echo 0)
            if [[ "$STATUS" == "exited" || "$STATUS" == "dead" ]] || (( RESTARTS >= 3 )); then
              echo "ERROR: elykia-test-backend unhealthy (status=$STATUS, restarts=$RESTARTS)" >&2
              break
            fi
            if probe_health "$CID"; then
              echo "Backend TEST health check PASSED (status=UP) after ${ELAPSED}s."
              HEALTHY=true
              break
            fi
            echo "Backend TEST not UP yet (${ELAPSED}s/${TIMEOUT}s, status=$STATUS, restarts=$RESTARTS)..."
            sleep 3
            ELAPSED=$((ELAPSED + 3))
          done

          if [[ "$HEALTHY" != "true" ]]; then
            echo "BACKEND HEALTH CHECK FAILED — LAST 80 LOG LINES:" >&2
            docker logs --tail=80 elykia-test-backend >&2 || true
            if [[ -n "$PREV_RELEASE" && -f "$PREV_RELEASE" ]]; then
              echo "TRIGGERING AUTOMATIC ROLLBACK to $PREV_RELEASE" >&2
              bash ./deploy/rollback.sh test "$PREV_RELEASE"
            else
              echo "No previous release file found for automatic rollback." >&2
            fi
            exit 1
          fi
          REMOTE_EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key
