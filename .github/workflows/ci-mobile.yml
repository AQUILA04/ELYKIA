name: ELYKIA CI Mobile Pipeline

# Mobile CI is decoupled from the deploy gate (ci.yml).
# A mobile failure does not block CD; build-mobile-apk.yml waits for both CD and this workflow.

on:
  push:
    branches: [ main, develop, 'release/**', 'prod/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          mobile:
            - 'mobile/**'

  build-mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Validate APK pipeline scripts
      working-directory: .
      run: |
        chmod +x .github/scripts/*.sh
        .github/scripts/validate-mobile-pipeline.sh

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.19.3'
        cache: 'npm'
        cache-dependency-path: 'mobile/package-lock.json'

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Clean npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Tests
      run: npm run test:e2e
      env:
        CI: true

    - name: Install Ionic CLI
      run: npm install -g @ionic/cli

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli

    - name: Build Ionic app
      run: |
        ionic build --prod

    - name: Add Android platform
      run: |
        npx cap add android

    - name: Create google-services.json
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

    - name: Configure Gradle for Crashlytics
      run: |
        sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.0'\n        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'" android/build.gradle
        sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'com.google.gms.google-services'\napply plugin: 'com.google.firebase.crashlytics'" android/app/build.gradle
        sed -i "/dependencies {/a \    implementation platform('com.google.firebase:firebase-bom:32.7.0')\n    implementation 'com.google.firebase:firebase-crashlytics'\n    implementation 'com.google.firebase:firebase-analytics'" android/app/build.gradle

    - name: Debug google-services.json
      run: |
        cat android/app/google-services.json
        python -m json.tool android/app/google-services.json

    - name: Sync Capacitor
      run: |
        npx cap sync android

    - name: Prepare Android Configuration
      run: |
        echo "=== Preparing Android configuration files ==="
        mkdir -p android/app/src/main/res/xml
        echo "Configuration files ready for post-sync copy"

    - name: Final Capacitor Sync
      run: |
        echo "=== Final sync after configuration ==="
        npx cap sync android

        echo "=== Capacitor sync completed, now re-applying our configurations ==="

        echo "Re-copying AndroidManifest.xml (simplified version) after sync..."
        cp .github/workflows/android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

        echo "Re-copying config.xml after sync..."
        cp .github/workflows/android-config/config.xml android/app/src/main/res/xml/config.xml

        echo "Re-copying network_security_config.xml after sync..."
        cp .github/workflows/android-config/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

        echo "Re-copying file_paths.xml after sync..."
        cp .github/workflows/android-config/file_paths.xml android/app/src/main/res/xml/file_paths.xml

        echo "=== Final verification after re-copy ==="
        echo "Checking permissions count:"
        grep -c "uses-permission" android/app/src/main/AndroidManifest.xml || echo "No permissions found!"

        echo "Checking application tag:"
        grep -A 5 "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml || echo "No cleartext traffic config found!"

    - name: Grant execute permission for gradlew
      run: |
        chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        if [ -f gradle.properties ]; then
          sed -i '/org.gradle.jvmargs/d' gradle.properties
          sed -i '/org.gradle.daemon/d' gradle.properties
        fi
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        ./gradlew assembleDebug --stacktrace

    - name: Extract App Version and Rename APK
      run: |
        VERSION=$(grep "version:" src/environments/environment.ts | sed "s/.*version: '\([^']*\)'.*/\1/")
        echo "Detected version: $VERSION"
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/elykia-mobile-dev-v$VERSION.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v6
      with:
        name: elykia-mobile-dev-v${{ env.APP_VERSION }}.apk
        path: mobile/android/app/build/outputs/apk/debug/elykia-mobile-dev-v${{ env.APP_VERSION }}.apk
        retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 10 }}
