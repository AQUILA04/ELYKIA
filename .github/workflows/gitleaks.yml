name: Secret scan

# Scanne l'arbre courant. L'historique Git contient encore d'anciens secrets :
# ce job ne les rejoue pas. La purge d'historique est une étape séparée, après rotation.

on:
  pull_request:
  push:
    branches: [main, develop, 'release/**', 'prod/**']

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan tracked files
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1
