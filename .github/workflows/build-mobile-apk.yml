name: ELYKIA Mobile APK Build

# Builds and publishes a release APK after a successful CD deployment (test or prod).
# Triggered when "ELYKIA CD Pipeline" completes; only runs if CI built the mobile app for the same commit.
# Target (test/prod) is inferred from which CD deploy job succeeded — not head_branch, because
# workflow_run chains execute on the default branch and would otherwise always look like main/test.
# Also supports a manual 'promote' workflow_dispatch to build the PROD APK from the current test release
# (same commit as deployed on test), mirroring the promote flow in cd.yml.

on:
  workflow_run:
    workflows: ["ELYKIA CD Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        type: choice
        required: true
        default: promote
        options:
          - promote

jobs:
  prepare:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote')
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.ctx.outputs.target }}
      mobile_built: ${{ steps.mobile.outputs.mobile_built }}
      build_sha: ${{ steps.build_sha.outputs.build_sha }}
    steps:
      - name: Resolve deployment target
        id: ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo "Manual promote: build PROD APK from current test release"
            echo "target=promote" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sudo apt-get update -y && sudo apt-get install -y jq
          CD_RUN_ID='${{ github.event.workflow_run.id }}'
          jobs_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${CD_RUN_ID}/jobs")

          promote_conclusion=$(echo "$jobs_json" | jq -r \
            '.jobs[] | select(.name=="Promote test -> prod") | .conclusion' | head -n1 || true)
          prod_conclusion=$(echo "$jobs_json" | jq -r \
            '.jobs[] | select(.name=="Deploy to PROD after CI") | .conclusion' | head -n1 || true)
          test_conclusion=$(echo "$jobs_json" | jq -r \
            '.jobs[] | select(.name=="Deploy to TEST after CI") | .conclusion' | head -n1 || true)

          if [ "$promote_conclusion" = "success" ]; then
            echo "CD promote detected: build PROD APK from current test release"
            echo "target=promote" >> "$GITHUB_OUTPUT"
          elif [ "$prod_conclusion" = "success" ]; then
            echo "CD prod deploy detected"
            echo "target=prod" >> "$GITHUB_OUTPUT"
          elif [ "$test_conclusion" = "success" ]; then
            echo "CD test deploy detected"
            echo "target=test" >> "$GITHUB_OUTPUT"
          else
            echo "target=" >> "$GITHUB_OUTPUT"
            echo "No deploy job succeeded in CD run $CD_RUN_ID" >&2
          fi

      - name: Resolve CI commit for test/prod deployment
        id: ci_sha
        if: steps.ctx.outputs.target == 'test' || steps.ctx.outputs.target == 'prod'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq
          TARGET='${{ steps.ctx.outputs.target }}'
          CD_STARTED='${{ github.event.workflow_run.run_started_at }}'
          CI_RUNS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=completed&per_page=30")

          if [ "$TARGET" = "test" ]; then
            SHA=$(echo "$CI_RUNS" | jq -r --arg cd "$CD_STARTED" '
              [.workflow_runs[]
                | select(.head_branch == "main" and .conclusion == "success")
                | select(.run_started_at <= $cd)
              ] | sort_by(.run_started_at) | last | .head_sha // empty')
          else
            SHA=$(echo "$CI_RUNS" | jq -r --arg cd "$CD_STARTED" '
              [.workflow_runs[]
                | select(.head_branch | startswith("prod/"))
                | select(.conclusion == "success")
                | select(.run_started_at <= $cd)
              ] | sort_by(.run_started_at) | last | .head_sha // empty')
          fi

          if [ -z "$SHA" ]; then
            echo "Could not resolve CI commit for target=$TARGET" >&2
            exit 2
          fi

          echo "Resolved CI commit for $TARGET: $SHA"
          echo "build_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve promote commit from current test release
        id: promote
        if: steps.ctx.outputs.target == 'promote'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          TEST_USER='${{ secrets.TEST_SERVER_USER }}'
          TEST_HOST='${{ secrets.TEST_SERVER_HOST }}'

          echo "Fetching current test release file"
          ssh -o StrictHostKeyChecking=no -i private_key "$TEST_USER@$TEST_HOST" \
            "cat /opt/elykia/test/releases/test_current.txt" > release.txt
          cat release.txt

          FRONTEND_IMAGE=$(grep '^FRONTEND_IMAGE=' release.txt | cut -d= -f2-)
          PROMOTE_SHA="${FRONTEND_IMAGE##*:}"

          if [ -z "$FRONTEND_IMAGE" ] || [ -z "$PROMOTE_SHA" ]; then
            echo "Could not determine commit to promote from test release" >&2
            exit 2
          fi

          echo "Resolved promote commit: $PROMOTE_SHA (from $FRONTEND_IMAGE)"
          echo "build_sha=$PROMOTE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set build SHA
        id: build_sha
        run: |
          set -euo pipefail
          target='${{ steps.ctx.outputs.target }}'
          if [ "$target" = "promote" ]; then
            sha='${{ steps.promote.outputs.build_sha }}'
            if [ -z "$sha" ]; then
              echo "Missing promote commit SHA" >&2
              exit 2
            fi
            echo "build_sha=$sha" >> "$GITHUB_OUTPUT"
          elif [ "$target" = "test" ] || [ "$target" = "prod" ]; then
            sha='${{ steps.ci_sha.outputs.build_sha }}'
            if [ -z "$sha" ]; then
              echo "Missing CI commit SHA for target=$target" >&2
              exit 2
            fi
            echo "build_sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if mobile was built in CI for this commit
        id: mobile
        if: steps.ctx.outputs.target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq
          HEAD_SHA='${{ steps.build_sha.outputs.build_sha }}'
          RUNS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&status=completed&per_page=5")
          CI_RUN_ID=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].id // empty')
          if [ -z "$CI_RUN_ID" ]; then
            echo "No successful CI run found for commit $HEAD_SHA"
            echo "mobile_built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CI run id: $CI_RUN_ID"
          jobs_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${CI_RUN_ID}/jobs")
          mobile_conclusion=$(echo "$jobs_json" | jq -r '.jobs[] | select(.name=="build-mobile") | .conclusion' | head -n1 || true)
          echo "build-mobile conclusion: $mobile_conclusion"
          if [ "$mobile_conclusion" = "success" ]; then
            echo "mobile_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup promote SSH key
        if: always() && steps.ctx.outputs.target == 'promote'
        run: rm -f private_key release.txt

  build-apk-test:
    needs: prepare
    if: needs.prepare.outputs.target == 'test' && needs.prepare.outputs.mobile_built == 'true'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}

      - name: Build and upload TEST APK
        uses: ./.github/actions/build-mobile-apk
        with:
          target: test
          api-url: ${{ secrets.TEST_API_URL }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-apk-prod:
    needs: prepare
    if: |
      needs.prepare.outputs.mobile_built == 'true' &&
      (needs.prepare.outputs.target == 'prod' || needs.prepare.outputs.target == 'promote')
    runs-on: ubuntu-latest
    environment: prod
    name: Build PROD APK
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}

      - name: Build and upload PROD APK
        uses: ./.github/actions/build-mobile-apk
        with:
          target: prod
          api-url: ${{ secrets.PROD_API_URL }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
