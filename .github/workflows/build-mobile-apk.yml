name: ELYKIA Mobile APK Build

# Builds a release APK after a successful CD deployment.
#   main  → test APK
#   prod/** → prod APK (direct, same commit as the prod CI)
#   promote (manual) → prod APK rebuilt from the last successful test deployment (GitHub API only)
#
# Target is inferred from which CD deploy job succeeded. workflow_run chains execute on the
# default branch, so head_branch must not be used for target detection.

on:
  workflow_run:
    workflows: ["ELYKIA CD Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        type: choice
        required: true
        default: promote
        options:
          - promote

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote')
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.ctx.outputs.target }}
      mobile_built: ${{ steps.mobile.outputs.mobile_built }}
      build_sha: ${{ steps.build_sha.outputs.build_sha }}
    steps:
      - name: Resolve deployment target
        id: ctx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo "Manual promote: build PROD APK from last test deployment"
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "sha_source=promote" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CD_RUN_ID='${{ github.event.workflow_run.id }}'
          jobs_json=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${CD_RUN_ID}/jobs")

          echo "CD run $CD_RUN_ID jobs:" >&2
          echo "$jobs_json" | jq -r '.jobs[] | "\(.name): \(.conclusion)"' >&2

          promote_conclusion=$(echo "$jobs_json" | jq -r \
            '.jobs[] | select(.name=="Promote test -> prod") | .conclusion' | head -n1 || true)
          prod_conclusion=$(echo "$jobs_json" | jq -r \
            '.jobs[] | select(.name=="Deploy to PROD after CI") | .conclusion' | head -n1 || true)
          test_conclusion=$(echo "$jobs_json" | jq -r \
            '.jobs[] | select(.name=="Deploy to TEST after CI") | .conclusion' | head -n1 || true)

          if [ "$prod_conclusion" = "success" ]; then
            echo "CD prod deploy detected → build PROD APK"
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "sha_source=prod" >> "$GITHUB_OUTPUT"
          elif [ "$promote_conclusion" = "success" ]; then
            echo "CD promote detected → build PROD APK from last test deployment"
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "sha_source=promote" >> "$GITHUB_OUTPUT"
          elif [ "$test_conclusion" = "success" ]; then
            echo "CD test deploy detected → build TEST APK"
            echo "target=test" >> "$GITHUB_OUTPUT"
            echo "sha_source=test" >> "$GITHUB_OUTPUT"
          else
            echo "target=" >> "$GITHUB_OUTPUT"
            echo "No deploy job succeeded in CD run $CD_RUN_ID" >&2
          fi

      - name: Resolve CI commit
        id: build_sha
        if: steps.ctx.outputs.target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq

          REPO='${{ github.repository }}'
          SHA_SOURCE='${{ steps.ctx.outputs.sha_source }}'
          CD_STARTED='${{ github.event.workflow_run.run_started_at }}'

          find_ci_sha_before() {
            local branch_filter="$1"
            local before_time="$2"
            local runs
            runs=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?status=completed&per_page=30")
            if [ "$branch_filter" = "main" ]; then
              echo "$runs" | jq -r --arg cd "$before_time" '
                [.workflow_runs[]
                  | select(.head_branch == "main" and .conclusion == "success")
                  | select(.run_started_at <= $cd)
                ] | sort_by(.run_started_at) | last | .head_sha // empty'
            else
              echo "$runs" | jq -r --arg cd "$before_time" '
                [.workflow_runs[]
                  | select(.head_branch | startswith("prod/"))
                  | select(.conclusion == "success")
                  | select(.run_started_at <= $cd)
                ] | sort_by(.run_started_at) | last | .head_sha // empty'
            fi
          }

          find_last_test_deploy_ci_sha() {
            local cd_runs run_id run_started jobs test_ok
            cd_runs=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/cd.yml/runs?status=completed&per_page=30")
            while read -r run_id run_started; do
              [ -z "$run_id" ] && continue
              jobs=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/jobs")
              test_ok=$(echo "$jobs" | jq -r \
                '.jobs[] | select(.name=="Deploy to TEST after CI") | .conclusion' | head -n1 || true)
              if [ "$test_ok" = "success" ]; then
                find_ci_sha_before "main" "$run_started"
                return 0
              fi
            done < <(echo "$cd_runs" | jq -r '.workflow_runs[] | "\(.id) \(.run_started_at)"')
            return 1
          }

          SHA=""
          case "$SHA_SOURCE" in
            test)
              SHA=$(find_ci_sha_before "main" "$CD_STARTED")
              ;;
            prod)
              SHA=$(find_ci_sha_before "prod" "$CD_STARTED")
              ;;
            promote)
              SHA=$(find_last_test_deploy_ci_sha) || true
              ;;
          esac

          if [ -z "$SHA" ]; then
            echo "Could not resolve CI commit (sha_source=$SHA_SOURCE)" >&2
            exit 2
          fi

          echo "Resolved CI commit ($SHA_SOURCE): $SHA"
          echo "build_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check if mobile was built in CI for this commit
        id: mobile
        if: steps.ctx.outputs.target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq
          HEAD_SHA='${{ steps.build_sha.outputs.build_sha }}'
          RUNS=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&status=completed&per_page=5")
          CI_RUN_ID=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].id // empty')
          if [ -z "$CI_RUN_ID" ]; then
            echo "No successful CI run found for commit $HEAD_SHA"
            echo "mobile_built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CI run id: $CI_RUN_ID"
          jobs_json=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${CI_RUN_ID}/jobs")
          mobile_conclusion=$(echo "$jobs_json" | jq -r '.jobs[] | select(.name=="build-mobile") | .conclusion' | head -n1 || true)
          echo "build-mobile conclusion: $mobile_conclusion"
          if [ "$mobile_conclusion" = "success" ]; then
            echo "mobile_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_built=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk-test:
    needs: prepare
    if: needs.prepare.outputs.target == 'test' && needs.prepare.outputs.mobile_built == 'true'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}

      - name: Build and upload TEST APK
        uses: ./.github/actions/build-mobile-apk
        with:
          target: test
          api-url: ${{ secrets.TEST_API_URL }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-apk-prod:
    needs: prepare
    if: needs.prepare.outputs.target == 'prod' && needs.prepare.outputs.mobile_built == 'true'
    runs-on: ubuntu-latest
    environment: prod
    name: Build PROD APK
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}

      - name: Build and upload PROD APK
        uses: ./.github/actions/build-mobile-apk
        with:
          target: prod
          api-url: ${{ secrets.PROD_API_URL }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
