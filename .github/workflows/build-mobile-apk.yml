name: ELYKIA Mobile APK Build

# Builds a release APK after CD deployed a commit AND ci-mobile validated it.
# Triggers on CD completion (mobile may still be running) or ci-mobile completion (CD may have run first).
#   main  → test APK
#   prod/** → prod APK (direct, same commit as the prod CI)
#   promote (manual) → prod APK rebuilt from the last successful TEST APK build (GitHub API only)

on:
  workflow_run:
    workflows: ["ELYKIA CD Pipeline", "ELYKIA CI Mobile Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        type: choice
        required: true
        default: promote
        options:
          - promote

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote')
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      mobile_built: ${{ steps.mobile.outputs.mobile_built }}
      build_sha: ${{ steps.resolve.outputs.build_sha }}
    steps:
      - name: Resolve deployment context
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq

          REPO='${{ github.repository }}'
          EVENT='${{ github.event_name }}'
          TRIGGER_PATH='${{ github.event.workflow_run.path }}'
          TRIGGER_SHA='${{ github.event.workflow_run.head_sha }}'
          TRIGGER_RUN_ID='${{ github.event.workflow_run.id }}'
          CD_STARTED='${{ github.event.workflow_run.run_started_at }}'

          find_ci_sha_before() {
            local branch_filter="$1"
            local before_time="$2"
            local runs
            runs=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?status=completed&per_page=30")
            if [ "$branch_filter" = "main" ]; then
              echo "$runs" | jq -r --arg cd "$before_time" '
                [.workflow_runs[]
                  | select(.head_branch == "main" and .conclusion == "success")
                  | select(.run_started_at <= $cd)
                ] | sort_by(.run_started_at) | last | .head_sha // empty'
            else
              echo "$runs" | jq -r --arg cd "$before_time" '
                [.workflow_runs[]
                  | select(.head_branch | startswith("prod/"))
                  | select(.conclusion == "success")
                  | select(.run_started_at <= $cd)
                ] | sort_by(.run_started_at) | last | .head_sha // empty'
            fi
          }

          # Promote must use the last run that actually built a TEST APK, not the
          # last CD TEST deploy (which may be a non-mobile commit with APK skipped).
          # SHA is embedded in the job name: "Build TEST APK <sha>".
          find_last_successful_test_apk_sha() {
            local workflow_file="$1"
            local current_run_id="${GITHUB_RUN_ID:-}"
            local apk_runs run_id run_number jobs_json job_line job_name job_status job_conclusion sha

            apk_runs=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow_file}/runs?per_page=30")

            while read -r run_id run_number; do
              [ -z "$run_id" ] && continue
              if [ -n "$current_run_id" ] && [ "$run_id" = "$current_run_id" ]; then
                continue
              fi

              jobs_json=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/jobs")

              job_line=$(echo "$jobs_json" | jq -r '
                [.jobs[]
                  | select(.name | startswith("Build TEST APK "))
                  | "\(.name)|\(.status)|\(.conclusion // "")"
                ][0] // empty')

              if [ -z "$job_line" ]; then
                continue
              fi

              job_name="${job_line%%|*}"
              rest="${job_line#*|}"
              job_status="${rest%%|*}"
              job_conclusion="${rest#*|}"

              if [ "$job_status" = "in_progress" ] || [ "$job_status" = "queued" ] \
                || [ "$job_status" = "waiting" ] || [ "$job_status" = "pending" ]; then
                echo "A TEST APK build is still running (run #${run_number}, id=${run_id}). Wait for it to finish before promoting." >&2
                return 2
              fi

              if [ "$job_conclusion" = "success" ]; then
                sha="${job_name#Build TEST APK }"
                if [ -n "$sha" ] && [ "$sha" != "$job_name" ]; then
                  echo "$sha"
                  return 0
                fi
              fi
            done < <(echo "$apk_runs" | jq -r '.workflow_runs[] | "\(.id) \(.run_number)"')

            return 1
          }

          resolve_target_from_cd_run() {
            local run_id="$1"
            local jobs_json prod promote test
            jobs_json=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/jobs")
            prod=$(echo "$jobs_json" | jq -r \
              '.jobs[] | select(.name=="Deploy to PROD after CI") | .conclusion' | head -n1 || true)
            promote=$(echo "$jobs_json" | jq -r \
              '.jobs[] | select(.name=="Promote test -> prod") | .conclusion' | head -n1 || true)
            test=$(echo "$jobs_json" | jq -r \
              '.jobs[] | select(.name=="Deploy to TEST after CI") | .conclusion' | head -n1 || true)
            if [ "$prod" = "success" ] || [ "$promote" = "success" ]; then
              echo "prod"
            elif [ "$test" = "success" ]; then
              echo "test"
            fi
          }

          resolve_target_from_cd_run_id() {
            local cd_run_id="$1"
            local jobs_json promote_conclusion prod_conclusion test_conclusion
            jobs_json=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/runs/${cd_run_id}/jobs")
            echo "CD run $cd_run_id jobs:" >&2
            echo "$jobs_json" | jq -r '.jobs[] | "\(.name): \(.conclusion)"' >&2
            promote_conclusion=$(echo "$jobs_json" | jq -r \
              '.jobs[] | select(.name=="Promote test -> prod") | .conclusion' | head -n1 || true)
            prod_conclusion=$(echo "$jobs_json" | jq -r \
              '.jobs[] | select(.name=="Deploy to PROD after CI") | .conclusion' | head -n1 || true)
            test_conclusion=$(echo "$jobs_json" | jq -r \
              '.jobs[] | select(.name=="Deploy to TEST after CI") | .conclusion' | head -n1 || true)
            if [ "$prod_conclusion" = "success" ]; then
              echo "prod|prod"
            elif [ "$promote_conclusion" = "success" ]; then
              echo "prod|promote"
            elif [ "$test_conclusion" = "success" ]; then
              echo "test|test"
            fi
          }

          TARGET=""
          BUILD_SHA=""
          MOBILE_RUN_ID=""

          resolve_promote_test_apk_sha() {
            local sha status
            set +e
            sha=$(find_last_successful_test_apk_sha "build-mobile-apk.yml")
            status=$?
            set -e
            if [ "$status" -eq 2 ]; then
              exit 2
            fi
            if [ "$status" -ne 0 ] || [ -z "$sha" ]; then
              echo "Could not find a successful TEST APK build to promote" >&2
              exit 2
            fi
            echo "$sha"
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TARGET="prod"
            BUILD_SHA=$(resolve_promote_test_apk_sha)
            echo "Manual promote → PROD APK from last successful TEST APK at $BUILD_SHA" >&2
          elif [ "$TRIGGER_PATH" = ".github/workflows/ci-mobile.yml" ]; then
            echo "Triggered by ci-mobile for commit $TRIGGER_SHA" >&2
            MOBILE_RUN_ID="$TRIGGER_RUN_ID"
            cd_runs=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${REPO}/actions/workflows/cd.yml/runs?status=completed&per_page=30")
            while read -r run_id run_sha; do
              [ -z "$run_id" ] && continue
              if [ "$run_sha" = "$TRIGGER_SHA" ]; then
                TARGET=$(resolve_target_from_cd_run "$run_id" || true)
                if [ -n "$TARGET" ]; then
                  BUILD_SHA="$TRIGGER_SHA"
                  echo "Found CD run $run_id for $TRIGGER_SHA → target=$TARGET" >&2
                  break
                fi
              fi
            done < <(echo "$cd_runs" | jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"')
            if [ -z "$TARGET" ]; then
              echo "No successful CD deploy found yet for commit $TRIGGER_SHA" >&2
            fi
          else
            echo "Triggered by CD run $TRIGGER_RUN_ID" >&2
            resolved=$(resolve_target_from_cd_run_id "$TRIGGER_RUN_ID" || true)
            if [ -n "$resolved" ]; then
              TARGET="${resolved%%|*}"
              SHA_SOURCE="${resolved#*|}"
              case "$SHA_SOURCE" in
                test) BUILD_SHA=$(find_ci_sha_before "main" "$CD_STARTED") ;;
                prod) BUILD_SHA=$(find_ci_sha_before "prod" "$CD_STARTED") ;;
                promote) BUILD_SHA=$(resolve_promote_test_apk_sha) ;;
              esac
              echo "Resolved CI commit ($SHA_SOURCE): $BUILD_SHA" >&2
            fi
          fi

          if [ -z "$TARGET" ] || [ -z "$BUILD_SHA" ]; then
            echo "target=" >> "$GITHUB_OUTPUT"
            echo "build_sha=" >> "$GITHUB_OUTPUT"
            echo "mobile_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "mobile_run_id=$MOBILE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check if mobile was validated in ci-mobile
        id: mobile
        if: steps.resolve.outputs.target != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y jq

          HEAD_SHA='${{ steps.resolve.outputs.build_sha }}'
          MOBILE_RUN_ID='${{ steps.resolve.outputs.mobile_run_id }}'

          if [ -z "$MOBILE_RUN_ID" ]; then
            RUNS=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci-mobile.yml/runs?head_sha=${HEAD_SHA}&status=completed&per_page=5")
            MOBILE_RUN_ID=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].id // empty')
            if [ -z "$MOBILE_RUN_ID" ]; then
              echo "No successful ci-mobile run found for commit $HEAD_SHA (may still be running)"
              echo "mobile_built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "ci-mobile run id: $MOBILE_RUN_ID"
          jobs_json=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${MOBILE_RUN_ID}/jobs")
          mobile_conclusion=$(echo "$jobs_json" | jq -r '.jobs[] | select(.name=="build-mobile") | .conclusion' | head -n1 || true)
          echo "build-mobile conclusion: $mobile_conclusion"

          if [ "$mobile_conclusion" = "success" ]; then
            echo "mobile_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_built=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk-test:
    needs: prepare
    if: needs.prepare.outputs.target == 'test' && needs.prepare.outputs.mobile_built == 'true'
    runs-on: ubuntu-latest
    environment: test
    name: Build TEST APK ${{ needs.prepare.outputs.build_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}

      - name: Overlay APK pipeline from workflow ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.sha }}" != "${{ needs.prepare.outputs.build_sha }}" ]; then
            git fetch --depth=1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}" -- \
              .github/actions/build-mobile-apk \
              .github/scripts
          fi

      - name: Build and upload TEST APK
        uses: ./.github/actions/build-mobile-apk
        with:
          target: test
          api-url: ${{ secrets.TEST_API_URL }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          minio-endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio-access-key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio-secret-key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          # Contabo: bucket test dédié (ne pas réutiliser le secret prod vide → mauvais défaut)
          minio-mobile-releases-bucket: elykia-mobile-releases-test

  build-apk-prod:
    needs: prepare
    if: needs.prepare.outputs.target == 'prod' && needs.prepare.outputs.mobile_built == 'true'
    runs-on: ubuntu-latest
    environment: prod
    name: Build PROD APK
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}

      - name: Overlay APK pipeline from workflow ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.sha }}" != "${{ needs.prepare.outputs.build_sha }}" ]; then
            git fetch --depth=1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}" -- \
              .github/actions/build-mobile-apk \
              .github/scripts
          fi

      - name: Build and upload PROD APK
        uses: ./.github/actions/build-mobile-apk
        with:
          target: prod
          api-url: ${{ secrets.PROD_API_URL }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          minio-endpoint: ${{ secrets.PROD_MINIO_ENDPOINT }}
          minio-access-key: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          minio-secret-key: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          minio-mobile-releases-bucket: elykia-mobile-releases
