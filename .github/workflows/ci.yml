name: ELYKIA CI Pipeline

# Deploy gate: frontend + backend + website image. Mobile runs in ci-mobile.yml and does not block CD.
# Customer-space runs in ci-customer-space.yml and does not block CD.
#
# Path detection:
#   pull_request → dorny/paths-filter vs PR base
#   push → since last successful component job (not last push only), so a CI-failed
#          commit that touched a path is still rebuilt when a later fix lands outside it.

on:
  push:
    branches: [ main, develop, 'release/**', 'prod/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.push.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend || steps.push.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile || steps.push.outputs.mobile }}
      website: ${{ steps.filter.outputs.website || steps.push.outputs.website }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: dorny/paths-filter@v4
      id: filter
      if: github.event_name == 'pull_request'
      with:
        filters: |
          frontend:
            - 'frontend/**'
            - 'user-guide/**'
          backend:
            - 'backend/**'
            - '.github/workflows/ci.yml'
            - '.github/scripts/resolve-backend-test-filter.py'
          mobile:
            - 'mobile/**'
          website:
            - 'website/**'

    - name: Detect path changes since last successful CI job
      id: push
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        WORKFLOW_FILE: ci.yml
        HEAD_SHA: ${{ github.sha }}
        HEAD_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        chmod +x .github/scripts/detect-path-changes-since-last-success.sh
        detect() {
          local out_name="$1"
          local job_name="$2"
          shift 2
          JOB_NAME="$job_name" \
            .github/scripts/detect-path-changes-since-last-success.sh "$@" \
            | tee "/tmp/detect-${out_name}.txt"
          echo "${out_name}=$(cat "/tmp/detect-${out_name}.txt")" >> "$GITHUB_OUTPUT"
        }
        detect frontend build-frontend 'frontend/**' 'user-guide/**'
        detect backend build-backend 'backend/**' '.github/workflows/ci.yml' '.github/scripts/resolve-backend-test-filter.py'
        # No build job in this workflow for mobile — use last successful CI run.
        detect mobile "" 'mobile/**'
        detect website build-website 'website/**'

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check eager frontend domains lazy-loading migration
      working-directory: .
      run: python .github/scripts/check-frontend-lazy-loading.py

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Run frontend unit tests (Vitest)
      run: npm run test:ci

    - name: Sync user-guide site into frontend
      working-directory: .
      run: |
        mkdir -p frontend/src/user-guide
        cp -r user-guide/site/* frontend/src/user-guide/

    - name: Set lowercase image name
      run: |
        # Ensure repository name is lowercase for Docker tags (GHCR requires lowercase repository names)
        echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:latest
        labels: ${{ steps.meta.outputs.labels }}

  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set lowercase image name
      run: |
        # Ensure repository name is lowercase for Docker tags (GHCR requires lowercase repository names)
        echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Resolve backend test scope (PR selective vs push full)
      id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "Push event → running full backend verify + JaCoCo + Docker push (required by CD)"
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "test_filter=" >> "$GITHUB_OUTPUT"
          echo "dockerfile_changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python3 .github/scripts/resolve-backend-test-filter.py >> "$GITHUB_OUTPUT"

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run backend quality gate (full)
      if: steps.scope.outputs.mode == 'full'
      run: mvn -B verify --file backend/pom.xml

    - name: Run backend selective module tests (PR)
      if: steps.scope.outputs.mode == 'selective'
      run: |
        echo "Selective Spring Modulith test filter: ${{ steps.scope.outputs.test_filter }}"
        mvn -B test -Djacoco.skip=true -Dsurefire.failIfNoSpecifiedTests=false \
          -Dtest="${{ steps.scope.outputs.test_filter }}" --file backend/pom.xml

    - name: Publish JaCoCo coverage report
      if: ${{ always() && steps.scope.outputs.mode == 'full' }}
      uses: actions/upload-artifact@v6
      with:
        name: backend-jacoco-${{ github.run_id }}
        path: backend/target/site/jacoco/
        if-no-files-found: warn
        retention-days: 14

    # Docker Build & Push for Backend:
    # - Always build & push on push (main, develop, release/**, prod/**) so CD resolves :${{ github.sha }}.
    # - On pull_request, skip Docker unless Dockerfile/entrypoint changed (build only, push: false).
    - name: Set up Docker Buildx
      if: github.event_name != 'pull_request' || steps.scope.outputs.dockerfile_changed == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: github.event_name != 'pull_request' || steps.scope.outputs.dockerfile_changed == 'true'
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend

    - name: Build and push Docker image
      if: github.event_name != 'pull_request' || steps.scope.outputs.dockerfile_changed == 'true'
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend:latest
        labels: ${{ steps.meta.outputs.labels }}

  build-website:
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set lowercase image name
      run: |
        echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-website

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./website
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-website:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-website:latest
        labels: ${{ steps.meta.outputs.labels }}

  ci-deploy-gate:
    name: Deploy gate
    needs: [changes, build-frontend, build-backend, build-website]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy-critical jobs
        run: |
          check() {
            local changed="$1"
            local result="$2"
            local name="$3"
            if [ "$changed" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$name was required for this push but ended with: $result"
              exit 1
            fi
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name ended with: $result"
              exit 1
            fi
          }
          check "${{ needs.changes.outputs.frontend }}" "${{ needs.build-frontend.result }}" "build-frontend"
          check "${{ needs.changes.outputs.backend }}" "${{ needs.build-backend.result }}" "build-backend"
          check "${{ needs.changes.outputs.website }}" "${{ needs.build-website.result }}" "build-website"
          echo "Deploy gate passed"
