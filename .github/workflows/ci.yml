name: ELYKIA CI Pipeline

# Deploy gate: frontend + backend only. Mobile runs in ci-mobile.yml and does not block CD.
# Customer-space runs in ci-customer-space.yml and does not block CD.

on:
  push:
    branches: [ main, develop, 'release/**', 'prod/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_lib: ${{ steps.filter.outputs.backend_lib }}
      mobile: ${{ steps.filter.outputs.mobile }}
      website: ${{ steps.filter.outputs.website }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          frontend:
            - 'frontend/**'
          backend:
            - 'backend/**'
          backend_lib:
            - 'backend-lib/**'
          mobile:
            - 'mobile/**'
          website:
            - 'website/**'

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check eager frontend domains lazy-loading migration
      working-directory: .
      run: python .github/scripts/check-frontend-lazy-loading.py

    - name: Set lowercase image name
      run: |
        # Ensure repository name is lowercase for Docker tags (GHCR requires lowercase repository names)
        echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-frontend:latest
        labels: ${{ steps.meta.outputs.labels }}

  build-backend:
    needs: [changes, build-backend-lib]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_lib == 'true') &&
      (needs.build-backend-lib.result == 'success' || needs.build-backend-lib.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set lowercase image name
      run: |
        # Ensure repository name is lowercase for Docker tags (GHCR requires lowercase repository names)
        echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: github
        settings-path: ${{ github.workspace }}

    # Build dependencies in order before building backend
    - name: Build common-entities
      run: mvn -B clean install -DskipTests --file backend-lib/common-entities/pom.xml

    - name: Build common-securities
      run: mvn -B clean install -DskipTests --file backend-lib/common-securities/pom.xml

    - name: Build elykia-client
      run: mvn -B clean install -DskipTests --file backend-lib/elykia-client/pom.xml

    - name: Package Backend
      run: mvn -B package -DskipTests --file backend/pom.xml

    - name: Deploy Backend Maven Artifact
      run: mvn -B deploy -DskipTests --file backend/pom.xml -s $GITHUB_WORKSPACE/settings.xml || echo "Deployment failed, likely because version already exists. Continuing..."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Docker Build & Push for Backend
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-backend:latest
        labels: ${{ steps.meta.outputs.labels }}

  build-backend-lib:
    needs: changes
    if: ${{ needs.changes.outputs.backend_lib == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Build and Deploy common-entities
      run: mvn -B deploy -DskipTests --file backend-lib/common-entities/pom.xml -s $GITHUB_WORKSPACE/settings.xml || echo "Deployment failed, likely because version already exists. Continuing..."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Deploy common-securities
      run: mvn -B deploy -DskipTests --file backend-lib/common-securities/pom.xml -s $GITHUB_WORKSPACE/settings.xml || echo "Deployment failed, likely because version already exists. Continuing..."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Deploy elykia-client
      run: mvn -B deploy -DskipTests --file backend-lib/elykia-client/pom.xml -s $GITHUB_WORKSPACE/settings.xml || echo "Deployment failed, likely because version already exists. Continuing..."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-deploy-gate:
    name: Deploy gate
    needs: [changes, build-frontend, build-backend, build-backend-lib]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy-critical jobs
        run: |
          check() {
            local changed="$1"
            local result="$2"
            local name="$3"
            if [ "$changed" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$name was required for this push but ended with: $result"
              exit 1
            fi
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name ended with: $result"
              exit 1
            fi
          }
          check "${{ needs.changes.outputs.frontend }}" "${{ needs.build-frontend.result }}" "build-frontend"
          check "${{ needs.changes.outputs.backend }}" "${{ needs.build-backend.result }}" "build-backend"
          check "${{ needs.changes.outputs.backend_lib }}" "${{ needs.build-backend-lib.result }}" "build-backend-lib"
          echo "Deploy gate passed"
