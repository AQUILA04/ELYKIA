<ion-content [fullscreen]="true" class="elyk-content">
  <div class="elyk-page">
    <header class="elyk-hero">
      <ion-toolbar class="hero-toolbar">
        <ion-buttons slot="start">
          <ion-back-button defaultHref="/tabs/clients"></ion-back-button>
        </ion-buttons>
      </ion-toolbar>
      <p class="elyk-surtitle">Terrain</p>
      <h1>À recouvrer</h1>
    </header>

    <div class="search-wrap elyk-search-overlap">
      <ion-searchbar
        class="elyk-searchbar"
        placeholder="Rechercher par nom ou quartier..."
        [formControl]="searchControl"
        mode="md">
      </ion-searchbar>
    </div>

    <div *ngIf="(isLoading$ | async) && !(groupedClients$ | async)?.length" class="elyk-empty">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Chargement des clients...</p>
    </div>

    <ng-container *ngIf="(groupedClients$ | async) as groups">
      <div *ngIf="groups.length > 0; else emptyState">
        <section *ngFor="let group of groups">
          <h2 class="elyk-quarter-title">{{ group.quarter }}</h2>
          <article
            class="elyk-client-card"
            *ngFor="let client of group.clients"
            (click)="openRecoveryPage(client.id)">
            <div class="card-left">
              <div class="elyk-avatar">
                <img [src]="client.photoUrl || 'assets/icon/person-circle-outline.svg'" alt="" />
              </div>
              <div class="card-info">
                <h3>{{ client.fullName || (client.firstname + ' ' + client.lastname) }}</h3>
                <p>{{ client.address }}</p>
                <p>{{ client.phone }}</p>
              </div>
            </div>
            <span class="elyk-amount elyk-amount--due" *ngIf="(client.account?.accountBalance || 0) < 0">
              {{ client.account?.accountBalance | currency:'XOF' }}
            </span>
            <ion-icon name="chevron-forward" class="elyk-chevron"></ion-icon>
          </article>
        </section>

        <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)" [disabled]="!(hasMore$ | async)">
          <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Chargement des clients suivants...">
          </ion-infinite-scroll-content>
        </ion-infinite-scroll>
      </div>

      <ng-template #emptyState>
        <div class="elyk-empty" *ngIf="!(isLoading$ | async)">
          <ion-icon name="document-text-outline"></ion-icon>
          <h2>Aucun client à recouvrer</h2>
          <p>Tous les comptes clients sont à jour.</p>
        </div>
      </ng-template>
    </ng-container>
  </div>
</ion-content>
