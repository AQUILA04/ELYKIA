<ion-header class="ion-no-border">
  <header class="elyk-hero elyk-hero--compact">
    <ion-toolbar class="hero-toolbar">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/more"></ion-back-button>
      </ion-buttons>
      <ion-title>
        <span class="elyk-surtitle">Paramètres</span>
        Erreurs de synchronisation
      </ion-title>
    </ion-toolbar>
  </header>
</ion-header>

<ion-content class="elyk-content">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ng-container *ngIf="syncErrors$ | async as errors; else loading">
    <div *ngIf="errors.length === 0" class="elyk-empty empty-wrap">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <h3>Aucune erreur</h3>
      <p>Aucune erreur de synchronisation.</p>
    </div>

    <div class="error-list" *ngIf="errors.length > 0">
      <div class="error-row elyk-client-card" *ngFor="let error of errors" (click)="goToDetails(error.id)">
        <div class="error-icon-wrap">
          <ion-icon name="warning-outline"></ion-icon>
        </div>
        <div class="error-info">
          <h2>{{ error.entityDisplayName }}</h2>
          <p class="error-meta">Type: {{ error.entityType }} · Opération: {{ error.operation }}</p>
          <p *ngIf="isValidDate(error.syncDate)">{{ error.syncDate | date:'dd/MM/yyyy HH:mm' }}</p>
          <p *ngIf="!isValidDate(error.syncDate)" class="muted">Date non disponible</p>
          <p class="error-message">{{ error.errorMessage }}</p>
        </div>
        <ion-icon name="chevron-forward" class="elyk-chevron"></ion-icon>
      </div>
    </div>
  </ng-container>

  <ng-template #loading>
    <div class="skeleton-list">
      <div class="elyk-card skeleton-card" *ngFor="let i of [1,2,3,4,5]">
        <ion-skeleton-text animated style="width: 60%; height: 16px; margin-bottom: 8px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 80%; height: 12px; margin-bottom: 6px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 90%; height: 12px;"></ion-skeleton-text>
      </div>
    </div>
  </ng-template>
</ion-content>
