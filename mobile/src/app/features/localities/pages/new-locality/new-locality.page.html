<ion-header class="ion-no-border">
  <header class="elyk-hero elyk-hero--compact">
    <ion-toolbar class="hero-toolbar">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/localities"></ion-back-button>
      </ion-buttons>
      <ion-title>
        <span class="elyk-surtitle">Données</span>
        Nouvelle Localité
      </ion-title>
    </ion-toolbar>
  </header>
</ion-header>

<ion-content class="elyk-content">
  <form class="form-wrap" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-card class="elyk-card">
      <ion-card-header><ion-card-title>Informations</ion-card-title></ion-card-header>
      <ion-card-content>
        <ion-item class="elyk-field" lines="none">
          <ion-label position="floating">Nom de la localité</ion-label>
          <ion-input formControlName="name" type="text"></ion-input>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>

<ion-footer class="elyk-footer-bar">
  <ion-toolbar>
    <ion-button expand="block" class="elyk-btn-navy" (click)="onSubmit()" [disabled]="form.invalid">Enregistrer</ion-button>
  </ion-toolbar>
</ion-footer>
