<ion-header class="ion-no-border">
  <header class="elyk-hero elyk-hero--compact modal-hero">
    <div class="modal-hero-top">
      <div class="modal-hero-text">
        <p class="elyk-surtitle">Synchronisation</p>
        <h2>Sélectionner {{ getEntityTypeLabel() }}</h2>
      </div>
      <button type="button" class="close-glass" (click)="dismiss()" aria-label="Fermer">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>
  </header>
</ion-header>

<ion-content class="elyk-content">
  <div class="search-wrap">
    <ion-searchbar
      class="elyk-searchbar"
      placeholder="Rechercher..."
      [value]="searchTerm$ | async"
      (ionInput)="onSearchChange($event)"
      [debounce]="300"
      mode="md">
    </ion-searchbar>
  </div>

  <div class="elyk-empty loading-container" *ngIf="(loading$ | async) && ((parents$ | async)?.length === 0)">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Chargement...</p>
  </div>

  <div class="parent-list" *ngIf="(parents$ | async) as parents">
    <div
      class="parent-row elyk-client-card"
      *ngFor="let parent of parents"
      [class.parent-selected]="selectedParentId === parent.id"
      (click)="selectParent(parent)">
      <ion-icon
        [name]="selectedParentId === parent.id ? 'radio-button-on' : 'radio-button-off'"
        class="radio-icon">
      </ion-icon>
      <div class="parent-info">
        <h2>{{ getParentName(parent) }}</h2>
        <p>{{ getParentDetails(parent) }}</p>
      </div>
      <ion-icon name="checkmark-circle" class="check-icon" *ngIf="selectedParentId === parent.id"></ion-icon>
    </div>

    <div class="elyk-empty" *ngIf="parents.length === 0 && !(loading$ | async)">
      <ion-icon name="search-outline"></ion-icon>
      <p>Aucun résultat trouvé.</p>
    </div>
  </div>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)" [disabled]="!((pagination$ | async)?.hasMore)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Chargement plus de données...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<ion-footer class="elyk-footer-bar">
  <ion-toolbar>
    <ion-button expand="block" class="elyk-btn-navy" (click)="validate()" [disabled]="!selectedParentId">
      Valider la sélection
    </ion-button>
  </ion-toolbar>
</ion-footer>
