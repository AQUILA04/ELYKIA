<div class="entity-sync-list" data-testid="e2e-sync-entity-list">
  <div class="elyk-card select-all-card" *ngIf="entities && entities.length > 0">
    <div class="select-all-row">
      <ion-checkbox [checked]="isAllSelected" (ionChange)="onToggleAll()"></ion-checkbox>
      <div class="select-all-text">
        <h3>Tout sélectionner</h3>
        <p>{{ entities.length }} élément(s) disponible(s)</p>
      </div>
    </div>
  </div>

  <div class="entity-list" *ngIf="entities && entities.length > 0">
    <div
      class="entity-row elyk-client-card"
      *ngFor="let entity of entities"
      [class.item-selected]="isSelected(entity.id)"
      [class.item-syncing]="isSyncing(entity.id)">
      <ion-checkbox
        [checked]="isSelected(entity.id)"
        [disabled]="isSyncing(entity.id)"
        (ionChange)="onToggle(entity.id)">
      </ion-checkbox>
      <div class="entity-icon-wrap">
        <ion-icon [name]="getEntityIcon()"></ion-icon>
      </div>
      <div class="entity-info">
        <h2>{{ getDisplayName(entity) }}</h2>
        <p>{{ getDisplayDetails(entity) }}</p>
      </div>
      <div class="entity-actions">
        <span class="elyk-badge status-badge" [ngClass]="'status-' + getStatusColor(entity.id)">
          {{ getStatusLabel(entity.id) }}
        </span>
        <ion-spinner *ngIf="isSyncing(entity.id)" name="crescent"></ion-spinner>
        <ion-button
          *ngIf="!isSyncing(entity.id) && canEditParent()"
          fill="clear"
          class="action-btn"
          (click)="onEditParent(entity.id, $event)"
          title="Modifier le parent">
          <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button
          *ngIf="!isSyncing(entity.id)"
          fill="clear"
          class="action-btn"
          (click)="onSync(entity.id, $event)"
          data-testid="e2e-sync-single-button">
          <ion-icon name="sync-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>

  <div class="elyk-empty empty-state" *ngIf="!entities || entities.length === 0">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <h3>Aucune donnée à synchroniser</h3>
    <p>Toutes les entités de cette catégorie sont déjà synchronisées.</p>
  </div>
</div>
