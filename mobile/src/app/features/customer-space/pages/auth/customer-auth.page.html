<!-- S-01 / S-02 — Authentification Espace Client ELYKIA -->
<ion-content class="auth-content">
  <div class="auth-wrapper">
    <div class="auth-logo">
      <span class="auth-logo__text">ELYKIA</span>
      <span class="auth-logo__sub">Espace Client</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-card__title">Connexion</h1>
      <p class="auth-card__subtitle">Accédez à votre espace personnel</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Numéro de téléphone</label>
          <ion-input
            formControlName="phone"
            type="tel"
            placeholder="+229 XX XX XX XX"
            class="form-input"
          ></ion-input>
        </div>

        <div class="form-group">
          <label class="form-label">Code PIN</label>
          <ion-input
            formControlName="pin"
            type="password"
            placeholder="••••"
            class="form-input"
          ></ion-input>
        </div>

        <div class="form-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <ion-button
          type="submit"
          expand="block"
          class="auth-btn"
          [disabled]="form.invalid || isLoading"
        >
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Se connecter</span>
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
