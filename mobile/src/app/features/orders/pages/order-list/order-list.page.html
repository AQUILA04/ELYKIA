<ion-content [fullscreen]="true" class="elyk-content">
  <ng-container *ngIf="vm$ | async as vm">
    <ion-refresher slot="fixed" (ionRefresh)="refreshOrders($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <header class="elyk-hero">
      <div class="elyk-hero-top">
        <div>
          <p class="elyk-surtitle">Ventes crédit</p>
          <h1>Commandes</h1>
        </div>
        <ion-button fill="clear" class="hero-add" (click)="createNewOrder()">
          <ion-icon slot="icon-only" name="add"></ion-icon>
        </ion-button>
      </div>
    </header>

    <div class="elyk-search-overlap">
      <ion-searchbar
        class="elyk-searchbar"
        placeholder="Rechercher par référence ou client..."
        [formControl]="searchControl"
        (ionClear)="clearSearch()"
        mode="md">
      </ion-searchbar>
    </div>

    <div class="elyk-empty loading-container" *ngIf="vm.loading && vm.orders.length === 0">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Chargement des commandes...</p>
    </div>

    <div class="error-container" *ngIf="vm.error">
      <div class="elyk-empty">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <h3>Erreur de chargement</h3>
        <p>{{ vm.error }}</p>
        <ion-button fill="outline" class="elyk-btn-outline" (click)="retryLoad()">
          <ion-icon name="refresh-outline" slot="start"></ion-icon>
          Réessayer
        </ion-button>
      </div>
    </div>

    <div class="orders-list" *ngIf="vm.orders.length > 0">
      <div class="list-header">
        <div class="list-title">Historique</div>
        <div class="list-count">{{ vm.totalItems }}</div>
      </div>

      <ion-list lines="none">
        <app-order-item
          *ngFor="let order of vm.orders; trackBy: trackByOrderId"
          [order]="order"
          (click)="openOrderDetail(order)">
        </app-order-item>
      </ion-list>

      <ion-infinite-scroll (ionInfinite)="loadMoreData($event)" [disabled]="!vm.hasMore">
        <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Chargement...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </div>

    <div class="elyk-empty" *ngIf="!vm.loading && vm.orders.length === 0 && !vm.error">
      <ion-icon name="receipt-outline"></ion-icon>
      <h3>Aucune commande</h3>
      <p *ngIf="!searchControl.value">Vous n'avez pas encore créé de commandes.</p>
      <p *ngIf="searchControl.value">Aucune commande ne correspond à votre recherche.</p>
      <ion-button class="elyk-btn-navy" *ngIf="!searchControl.value" (click)="createNewOrder()">
        Créer une commande
      </ion-button>
    </div>
  </ng-container>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button class="elyk-fab" (click)="createNewOrder()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
