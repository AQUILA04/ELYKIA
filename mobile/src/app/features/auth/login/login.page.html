<ion-content class="login-container">
  <div class="login-page-wrapper">
    <div class="login-header">
      <div class="app-logo" aria-hidden="true">📱</div>
      <div class="app-title">AMENOUVEVE-YAVEH</div>
      <div class="app-subtitle">ELYKIA</div>
      <div class="app-subtitle">Gestion Mobile</div>
    </div>

    <div class="login-form-container">
      <ion-card class="login-form">
        <form #loginForm="ngForm">
          <ion-item lines="none" class="input-group">
            <ion-label position="stacked" class="input-label">Nom d'utilisateur *</ion-label>
            <ion-input type="text" placeholder="Saisissez votre nom d'utilisateur" [(ngModel)]="username"
              name="username" required autocomplete="username">
              <ion-icon name="person-outline" slot="start" class="input-icon"></ion-icon>
            </ion-input>
          </ion-item>

          <ion-item lines="none" class="input-group">
            <ion-label position="stacked" class="input-label">Mot de passe *</ion-label>
            <ion-input [type]="passwordVisible ? 'text' : 'password'" placeholder="Saisissez votre mot de passe"
              [(ngModel)]="password" name="password" required autocomplete="current-password">
              <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
              <ion-button fill="clear" size="small" slot="end" class="password-toggle"
                type="button" (click)="togglePasswordVisibility()">
                <ion-icon [name]="passwordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </ion-input>
          </ion-item>

          <div class="error-message" *ngIf="error$ | async as error">
            {{ error }}
          </div>

          <ion-button expand="block" class="btn-login" type="button" (click)="onLogin()"
            [disabled]="!loginForm.form.valid">
            SE CONNECTER
          </ion-button>

          <div class="secondary-actions">
            <ion-button expand="block" fill="outline" class="btn-secondary" type="button"
              (click)="onOpenWeb()">
              <ion-icon name="globe-outline" slot="start"></ion-icon>
              Se connecter sur le web
            </ion-button>

            <ion-button expand="block" fill="outline" class="btn-secondary" type="button"
              (click)="onRestore()">
              <ion-icon name="sync-circle-outline" slot="start"></ion-icon>
              Restaurer une sauvegarde
            </ion-button>
          </div>

          @if (isOnline$ | async; as isOnline) {
          <div class="connection-status">
            <div class="status-indicator status-online"></div>
            <span>Connecté</span>
          </div>
          } @else {
          <div class="connection-status">
            <div class="status-indicator status-offline"></div>
            <span>Hors ligne</span>
          </div>
          }
        </form>
      </ion-card>
    </div>

    <div class="login-footer">
      <div class="version-info" (click)="showLogs()">Version {{ appVersion }}</div>
    </div>
  </div>
</ion-content>
