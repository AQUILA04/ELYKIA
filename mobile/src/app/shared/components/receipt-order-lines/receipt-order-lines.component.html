<section class="body-section">
  <div class="section-title">
    <h3>Détail de la commande</h3>
  </div>

  <p class="empty-articles" *ngIf="!hasItems">Aucun article</p>
  <div class="lines" *ngIf="hasItems">
    <div class="line" *ngFor="let item of items; let i = index">
      <span class="idx">{{ i + 1 }}</span>
      <div class="art">
        <span class="art-name">{{ item.articleName }}</span>
        <span class="art-meta" *appIfUnitPrice="saleType">{{ item.quantity }} × {{ item.unitPrice | number:'1.0-0' }}</span>
        <span class="art-meta" *appIfNoUnitPrice="saleType">Qté {{ item.quantity }}</span>
      </div>
      <span class="qty">{{ item.quantity }}</span>
      <span class="line-total elyk-amount" *appIfUnitPrice="saleType">{{ item.totalPrice | number:'1.0-0' }}</span>
    </div>
  </div>

  <div class="totals">
    <div class="grand">
      <span>Total à payer</span>
      <b class="elyk-amount">{{ totalAmount | number:'1.0-0' }} FCFA</b>
    </div>
  </div>
</section>
