<!-- ════════════════════════════════════════════════════════════════
     STOCK RETURN FORM — Story 2.3
     Skill: elykia-stock-components-build / components.md §4
     Mirrors request-form with addition of optional comment textarea.
     ════════════════════════════════════════════════════════════════ -->

<!-- Modal Header -->
<ion-header class="ion-no-border form-header">
  <ion-toolbar class="form-toolbar">
    <ion-buttons slot="start">
      <ion-button
        id="ret-form-cancel-btn"
        fill="clear"
        class="form-close-btn"
        (click)="onCancel()"
        [disabled]="isSubmitting">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="form-title">Nouveau Retour</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">
  <div class="form-container">

    <!-- Section : Articles retournés -->
    <div class="section-card">
      <div class="section-header">
        <ion-icon name="return-down-back-outline" class="section-icon"></ion-icon>
        <h2 class="section-title">Articles retournés</h2>
      </div>

      <div class="items-list">
        <div class="item-row" *ngFor="let item of items; let i = index" [id]="'ret-item-row-' + i">

          <!-- Sélecteur d'article -->
          <ion-item lines="none" class="article-item">
            <ion-select
              [id]="'ret-article-select-' + i"
              label="Article"
              labelPlacement="floating"
              [value]="item.article.id || ''"
              (ionChange)="onArticleChange(i, $event)"
              [disabled]="isSubmitting || availableArticles.length === 0"
              interface="alert">
              <ion-select-option
                *ngFor="let article of availableArticles"
                [value]="article.id">
                {{ article.name }}
              </ion-select-option>
            </ion-select>
          </ion-item>

          <!-- Input quantité -->
          <ion-item lines="none" class="qty-item">
            <ion-input
              [id]="'ret-qty-input-' + i"
              type="number"
              inputmode="numeric"
              label="Qté"
              labelPlacement="floating"
              [(ngModel)]="item.quantity"
              [disabled]="isSubmitting"
              min="1">
            </ion-input>
          </ion-item>

          <!-- Bouton suppression -->
          <ion-button
            [id]="'ret-remove-item-' + i"
            fill="clear"
            color="danger"
            class="remove-btn"
            (click)="removeItem(i)"
            [disabled]="isSubmitting || items.length === 1">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>

        </div>
      </div>

      <!-- Bouton : Ajouter un article -->
      <ion-button
        id="ret-add-item-btn"
        expand="block"
        fill="outline"
        class="add-item-btn"
        (click)="addItem()"
        [disabled]="isSubmitting">
        <ion-icon name="add-outline" slot="start"></ion-icon>
        Ajouter un article
      </ion-button>
    </div>

    <!-- Section : Commentaire (optionnel — Story 2.3 AC1) -->
    <div class="section-card">
      <div class="section-header">
        <ion-icon name="chatbubble-outline" class="section-icon"></ion-icon>
        <h2 class="section-title">Commentaire <span class="optional-label">(optionnel)</span></h2>
      </div>

      <ion-item lines="none" class="comment-item">
        <ion-textarea
          id="ret-comment-textarea"
          [(ngModel)]="comment"
          [disabled]="isSubmitting"
          placeholder="Motif du retour, observations..."
          rows="3"
          maxlength="500"
          autoGrow="true">
        </ion-textarea>
      </ion-item>
    </div>

    <!-- Message de validation -->
    <div class="validation-hint" *ngIf="items.length > 0 && !isValid">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Sélectionnez un article et une quantité ≥ 1 pour chaque ligne.</span>
    </div>

  </div>
</ion-content>

<!-- Footer fixe avec bouton Soumettre -->
<ion-footer class="form-footer">
  <ion-toolbar class="form-footer-toolbar">
    <ion-button
      id="ret-form-submit-btn"
      expand="block"
      class="submit-btn"
      (click)="onSubmit()"
      [disabled]="!isValid || isSubmitting">
      <ion-spinner *ngIf="isSubmitting" name="crescent" slot="start"></ion-spinner>
      <span *ngIf="!isSubmitting">Enregistrer le retour</span>
      <span *ngIf="isSubmitting">Envoi en cours...</span>
    </ion-button>
  </ion-toolbar>
</ion-footer>
