version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: elykia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oec_v2}
      POSTGRES_USER: ${POSTGRES_USER:-elykia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elykia-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ghcr.io/aquila04/elykia-backend:main
    container_name: elykia-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oec_v2}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-elykia}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - elykia-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: ghcr.io/aquila04/elykia-frontend:main
    container_name: elykia-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - elykia-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  elykia-network:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
